    ctx.fillText("Open a folder or load files.", tlX + 10, tlY + 24);
    ctx.fillText("Click to audition.", tlX + 10, tlY + 40);
    ctx.fillText("Drag onto any Pad or Track.", tlX + 10, tlY + 56);
  } else {
    const startIdx = Math.floor(treeScroll / rowH), endIdx = Math.min(treeFlat.length, startIdx + Math.ceil(tlH / rowH) + 2);
    for (let i = startIdx; i < endIdx; i++) {
      const item = treeFlat[i], iy = tlY + i * rowH - treeScroll;
      const isHov = hit({ x: tlX, y: iy, w: tlW - 12, h: rowH }, mx, my) && hit(treeListRect, mx, my);
      const isAud = item.type === "file" && treeAudName === item.name;
      if (isAud || isHov) {
        ctx.fillStyle = isAud ? "rgba(0, 240, 255, 0.22)" : "rgba(255, 255, 255, 0.08)";
        ctx.fillRect(tlX + 2, iy + 1, tlW - 16, rowH - 2);
      }
      ctx.fillStyle = item.type === "dir" ? "#ffbb44" : (isAud ? "#00ffcc" : "#cfe0f5");
      ctx.font = "10px monospace";
      const icon = item.type === "dir" ? (item.open ? "📂 " : "📁 ") : "🎵 ";
      const indent = item.depth * 11;
      ctx.fillText((icon + item.name).slice(0, 25 - Math.floor(indent / 6)), tlX + 6 + indent, iy + 14);
    }
  }
  ctx.restore();

  const tsbX = tlX + tlW - 10;
  ctx.fillStyle = "rgba(0,0,0,0.5)"; rrect(ctx, tsbX, tlY + 2, 8, tlH - 4, 4); ctx.fill();
  if (maxScroll > 0) {
    const th = Math.max(24, (tlH / (treeFlat.length * rowH)) * (tlH - 4));
    const ty = tlY + 2 + (treeScroll / maxScroll) * (tlH - 4 - th);
    treeThumbRect = { x: tsbX - 2, y: ty, w: 12, h: th, trackY: tlY + 2, trackH: tlH - 4, maxScroll };
    ctx.fillStyle = "rgba(0, 240, 255, 0.55)"; rrect(ctx, tsbX + 1, ty, 6, th, 3); ctx.fill();
  } else treeThumbRect = null;

  // --- MAIN RIGHT AREA: TOP MENU + TABS ---
  const mX = padM + sbW + 8, mW = W - mX - padM, topH = 38;
  drawGlassPanel(mX, padM, mW, topH);

  let tx = mX + 8;
  menuBtnRects.file = { x: tx, y: padM + 6, w: 50, h: 26 };
  drawRubberBtn("menu_file", tx, padM + 6, 50, 26, "FILE", {
    active: openMenu === "file", color: "#00ffcc",
    onClick: () => { openMenu = openMenu === "file" ? null : "file"; }
  });
  tx += 54;

  menuBtnRects.edit = { x: tx, y: padM + 6, w: 50, h: 26 };
  drawRubberBtn("menu_edit", tx, padM + 6, 50, 26, "EDIT", {
    active: openMenu === "edit", color: "#00ffcc",
    onClick: () => { openMenu = openMenu === "edit" ? null : "edit"; }
  });
  tx += 58;

  const tabDefs = [
    ["pads", "[1] 8-PAD MATRIX"],
    ["edit", `[2] WAVE (P${activePad + 1})`],
    ["seq",  "[3] SONG TIMELINE"],
    ["step", `[4] STEP (P${activeStepPat + 1})`]
  ];
  for (const [key, lbl] of tabDefs) {
    const bw = 132;
    drawRubberBtn("tab_" + key, tx, padM + 6, bw, 26, lbl, { active: activeTab === key, color: "#00f0ff", onClick: () => switchTab(key) });
    tx += bw + 5;
  }
  drawRubberBtn("panic", mX + mW - 90, padM + 6, 82, 26, "■ STOP ALL", { color: "#ff3355", active: edPlaying || seqRunning || stepRunning, onClick: stopAllAudio });

  ctx.fillStyle = "rgba(180, 225, 255, 0.78)"; ctx.font = "10px monospace";
  const stAvail = (mX + mW - 98) - (tx + 4);
  if (stAvail > 60) ctx.fillText(statusMsg.slice(0, Math.floor(stAvail / 6.2)), tx + 4, padM + 22);

  const bodyY = padM + topH + 8, bodyH = H - bodyY - padM;
  if (activeTab === "pads") drawPadsTab(mX, bodyY, mW, bodyH);
  else if (activeTab === "edit") drawEditorTab(mX, bodyY, mW, bodyH);
  else if (activeTab === "seq") drawTimelineTab(mX, bodyY, mW, bodyH);
  else if (activeTab === "step") drawStepTab(mX, bodyY, mW, bodyH);

  if (activeDrag && activeDrag.type === "treeDrag") {
    const lbl = "🎵 " + activeDrag.name.slice(0, 26);
    ctx.save(); ctx.font = "bold 11px monospace";
    const pw = ctx.measureText(lbl).width + 24;
    ctx.fillStyle = "rgba(10, 24, 42, 0.88)"; rrect(ctx, mx + 12, my - 14, pw, 28, 14); ctx.fill();
    ctx.strokeStyle = "#00f0ff"; ctx.lineWidth = 1.5; rrect(ctx, mx + 12.5, my - 13.5, pw - 1, 27, 14); ctx.stroke();
    ctx.fillStyle = "#ffffff"; ctx.fillText(lbl, mx + 24, my + 4); ctx.restore();
  }

  drawDropdownMenu();
}

// --- TAB 1: 8-PAD MATRIX ---
function drawPadsTab(x, y, w, h) {
  drawGlassPanel(x, y, w, h, "SP-202 8-PAD MATRIX // LIVE LED DURATION SYNC // KEYS 1-8 TRIGGER");
  drawRubberBtn("pmSong", x + w - 188, y + 4, 86, 18, seqRunning ? "■ SONG" : "▶ SONG", {
    active: seqRunning, color: "#00ff88", onClick: () => seqRunning ? stopSeq() : startSeq()
  });
  drawRubberBtn("pmPat", x + w - 96, y + 4, 86, 18, stepRunning ? `■ PAT P${activeStepPat + 1}` : `▶ PAT P${activeStepPat + 1}`, {
    active: stepRunning, color: "#ffaa00", onClick: () => stepRunning ? stopStepPat() : startStepPat()
  });

  const gx = x + 14, gy = y + 32, gw = w - 28, gh = h - 46, gap = 12, pw = (gw - gap * 3) / 4, ph = (gh - gap) / 2;
  for (let i = 0; i < 8; i++) {
    const col = i % 4, row = Math.floor(i / 4), px = gx + col * (pw + gap), py = gy + row * (ph + gap);
    const pad = pads[i], pCol = TRK_COLS[i], isAct = activePad === i, led = getPadLedState(pad);

    dropZones.push({ x: px, y: py, w: pw, h: ph, onDrop: f => loadFileToPad(i, f, false) });
    drawGlassPanel(px, py, pw, ph, null, led.lit ? pCol : (isAct ? pCol : "rgba(180,220,255,0.18)"), led.lit ? 0.16 : 0);

    ctx.save();
    ctx.beginPath(); ctx.arc(px + 17, py + 18, 4.5, 0, Math.PI * 2);
    if (led.lit) {
      ctx.fillStyle = pCol; ctx.shadowColor = pCol; ctx.shadowBlur = 10; ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(px + 16, py + 17, 1.5, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = "#182230"; ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.restore();

    ctx.fillStyle = led.lit ? "#ffffff" : pCol; ctx.font = "bold 11px monospace";
    ctx.fillText(`PAD ${i + 1}`, px + 28, py + 22);
    drawRubberBtn(`padEd_${i}`, px + pw - 60, py + 7, 50, 22, "EDIT", { color: "#00ffcc", onClick: () => { activePad = i; switchTab("edit"); } });

    const trigY = py + 36, trigH = Math.max(40, ph - 78);
    drawRubberBtn(`padTrig_${i}`, px + 10, trigY, pw - 20, trigH, pad.rawBuf ? `▶ PAD ${i + 1} [${i + 1}]` : `EMPTY PAD ${i + 1}`, {
      active: led.lit, color: pCol, font: "bold 12px monospace", ledProg: led.lit ? led.prog : -1, onClick: () => triggerPad(i)
    });

    const fy = py + ph - 34;
    ctx.fillStyle = pad.rawBuf ? (led.lit ? "#ffffff" : "#e0f2ff") : "#55687a"; ctx.font = "10px monospace";
    ctx.fillText(pad.name.slice(0, Math.floor((pw - 24) / 6.5)), px + 12, fy + 4);
    const orig = getPadOrigBpm(pad);
    ctx.fillStyle = "#88aacc"; ctx.fillText(`${G[pad.grd].name} | ${orig ? Math.round(orig * pad.pt) + " BPM" : "-- BPM"}`, px + 12, fy + 18);

    drawRubberBtn(`padLp_${i}`, px + pw - 94, fy + 5, 46, 22, "LOOP", {
      active: pad.loop, color: "#00ff88",
      onClick: () => {
        pushUndo("Toggle Pad Loop"); pad.loop = !pad.loop;
        for (const v of liveVoices) if (v.ownerKey === `pad_${i}`) v.loop = pad.loop;
      }
    });
    drawRubberBtn(`padSt_${i}`, px + pw - 44, fy + 5, 34, 22, "■", { color: "#ff4466", onClick: () => stopPadNode(pad) });
  }
}

// --- TAB 2: WAVE EDITOR (WITH PAD SWITCHER) ---
function drawEditorTab(x, y, w, h) {
  const pad = pads[activePad];
  const wavePanelH = Math.max(200, Math.min(270, Math.floor(h * 0.44)));
  drawGlassPanel(x, y, w, wavePanelH, `WAVE EDITOR // PAD ${activePad + 1} : ${pad.name.slice(0, 22)}`);
  dropZones.push({ x, y, w, h: wavePanelH, onDrop: f => loadFileToPad(activePad, f, true) });

  const pBtnW = 28, pGap = 3, stripW = 8 * pBtnW + 7 * pGap;
  let psx = x + w - stripW - 10;
  for (let i = 0; i < 8; i++) {
    const hasBuf = !!pads[i].rawBuf;
    drawRubberBtn(`edPad_${i}`, psx, y + 3, pBtnW, 15, `P${i + 1}`, {
      active: activePad === i,
      color: hasBuf ? TRK_COLS[i] : "#55687a",
      font: "bold 9px monospace",
      onClick: () => {
        if (edPlaying) stopEditorPlay();
        activePad = i;
        viewZoom = 1; viewOffset = 0;
        ovCacheDirty = waveCacheDirty = true;
        statusMsg = `WAVE EDITOR -> PAD ${i + 1}: ${pads[i].name}`;
      }
    });
    psx += pBtnW + pGap;
  }

  const innerX = x + 10, innerW = w - 20;

  let phNorm = -1, phSec = 0, phSource = "";
  if (pad.rawBuf) {
    if (edPlaying) {
      phNorm = Math.max(0, Math.min(1, readPos / pad.rawBuf.length));
      phSec = readPos / pad.rawBuf.sampleRate; phSource = "EDIT";
    } else if ((seqRunning || stepRunning) && ac && pad.lastTrigTime >= 0) {
      const elapsed = ac.currentTime - pad.lastTrigTime, dur = getPadOutDur(pad) / (pad.lastTrigRate || 1);
      if (elapsed >= 0 && elapsed <= dur) {
        phNorm = pad.st + (elapsed / Math.max(0.0001, dur)) * (pad.en - pad.st);
        phSec = phNorm * pad.rawBuf.duration; phSource = seqRunning ? "SONG SYNC" : "STEP SYNC";
      }
    }
  }

  const ovY = y + 23, ovH = 34;
  ovRect = { x: innerX, y: ovY, w: innerW, h: ovH };
  if (ovCacheDirty || ovWfCv.width !== Math.floor(innerW) || ovWfCv.height !== ovH) renderOverviewCache(Math.floor(innerW), ovH);
  ctx.drawImage(ovWfCv, innerX, ovY);
  const vx = innerX + viewOffset * innerW, vw = Math.max(8, (1 / viewZoom) * innerW);
  ctx.fillStyle = "rgba(0, 240, 255, 0.16)"; ctx.fillRect(vx, ovY, vw, ovH);
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.3; ctx.strokeRect(vx + 0.5, ovY + 0.5, vw - 1, ovH - 1);
  if (phNorm >= 0) {
    const opx = innerX + phNorm * innerW;
    ctx.strokeStyle = phSource === "EDIT" ? "#00ffaa" : "#ff44cc"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(opx, ovY); ctx.lineTo(opx, ovY + ovH); ctx.stroke();
  }

  const wvY = ovY + ovH + 5, wvH = Math.max(76, wavePanelH - 118);
  waveRect = { x: innerX, y: wvY, w: innerW, h: wvH };
  if (waveCacheDirty || wfCv.width !== Math.floor(innerW) || wfCv.height !== Math.floor(wvH)) renderWaveCache(Math.floor(innerW), Math.floor(wvH));
  ctx.drawImage(wfCv, innerX, wvY);

  if (phNorm >= 0) {
    const px = innerX + ((phNorm - viewOffset) / (1 / viewZoom)) * innerW;
    const isSync = phSource !== "EDIT";
    if (px >= innerX - 2 && px <= innerX + innerW + 2) {
      const trW = 24, tg = ctx.createLinearGradient(px - trW, 0, px, 0);
      tg.addColorStop(0, "rgba(0,0,0,0)"); tg.addColorStop(1, isSync ? "rgba(255, 68, 204, 0.30)" : "rgba(0, 255, 170, 0.30)");
      ctx.fillStyle = tg; ctx.fillRect(Math.max(innerX, px - trW), wvY, Math.min(trW, px - innerX), wvH);
      ctx.strokeStyle = isSync ? "rgba(255, 68, 204, 0.65)" : "rgba(0, 255, 170, 0.65)"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(px, wvY); ctx.lineTo(px, wvY + wvH); ctx.stroke();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(px, wvY); ctx.lineTo(px, wvY + wvH); ctx.stroke();
    }
    const tStr = isSync ? `${phSource} ${phSec.toFixed(2)}s` : `T: ${phSec.toFixed(2)}s`;
    ctx.font = "10px monospace"; const tw = ctx.measureText(tStr).width + 14;
    ctx.fillStyle = "rgba(4,10,20,0.85)"; ctx.fillRect(innerX + innerW - tw - 6, wvY + wvH - 20, tw, 16);
    ctx.fillStyle = isSync ? "#ff66dd" : "#00ffaa"; ctx.fillText(tStr, innerX + innerW - tw, wvY + wvH - 8);
  }

  const sbY = wvY + wvH + 5, sbH = 16;
  drawRubberBtn("hScrL", innerX, sbY, 22, sbH, "◀", { onClick: () => { viewOffset -= (1 / viewZoom) * 0.25; clampView(); waveCacheDirty = true; } });
  drawRubberBtn("hScrR", innerX + innerW - 22, sbY, 22, sbH, "▶", { onClick: () => { viewOffset += (1 / viewZoom) * 0.25; clampView(); waveCacheDirty = true; } });
  const trkX = innerX + 26, trkW = innerW - 52;
  hScrRect = { x: trkX, y: sbY, w: trkW, h: sbH };
  ctx.fillStyle = "rgba(4, 8, 16, 0.85)"; rrect(ctx, trkX, sbY, trkW, sbH, 5); ctx.fill();
  ctx.strokeStyle = "rgba(0, 240, 255, 0.22)"; rrect(ctx, trkX + 0.5, sbY + 0.5, trkW - 1, sbH - 1, 5); ctx.stroke();

  const thumbW = Math.max(32, trkW * (1 / viewZoom)), maxOff = Math.max(0.00001, 1 - 1 / viewZoom);
  const thumbX = trkX + (viewZoom > 1.001 ? (viewOffset / maxOff) * (trkW - thumbW) : 0);
  hThumbRect = { x: thumbX, y: sbY + 2, w: thumbW, h: sbH - 4 };
  ctx.fillStyle = viewZoom > 1.001 ? "rgba(0, 240, 255, 0.65)" : "rgba(110, 140, 170, 0.28)";
  rrect(ctx, thumbX + 1, sbY + 2, thumbW - 2, sbH - 4, 4); ctx.fill();

  const tbY = sbY + sbH + 6; let bx = innerX;
  drawRubberBtn("zmIn", bx, tbY, 58, 22, "ZOOM +", { onClick: () => setZoom(viewZoom * 2) }); bx += 62;
  drawRubberBtn("zmOut", bx, tbY, 60, 22, "ZOOM -", { onClick: () => setZoom(viewZoom / 2) }); bx += 64;
  drawRubberBtn("zmFull", bx, tbY, 58, 22, "FULL 1x", { onClick: () => { viewZoom = 1; viewOffset = 0; clampView(); waveCacheDirty = true; } }); bx += 64;
  drawRubberBtn("lockSE", bx, tbY, 102, 22, pad.lockSE ? "🔒 S/E LOCKED" : "🔓 LOCK S/E", {
    active: pad.lockSE, color: "#ffaa00",
    onClick: () => { pushUndo("Toggle S/E Lock"); pad.lockSE = !pad.lockSE; ovCacheDirty = waveCacheDirty = true; statusMsg = pad.lockSE ? "START & END LOCKED" : "START & END UNLOCKED"; }
  }); bx += 110;
  drawRubberBtn("edPlay", bx, tbY, 72, 22, "▶ PLAY", { active: edPlaying, color: "#00ff88", onClick: () => startEditorPlay() }); bx += 76;
  drawRubberBtn("edStop", bx, tbY, 58, 22, "■ STOP", { color: "#ff4466", onClick: stopEditorPlay }); bx += 64;
  drawRubberBtn("edSong", bx, tbY, 84, 22, seqRunning ? "■ SONG" : "▶ SONG", { active: seqRunning, color: "#ff44cc", onClick: () => seqRunning ? stopSeq() : startSeq() });
  drawRubberBtn("edExp", innerX + innerW - 128, tbY, 128, 22, "EXPORT 202 WAV", { color: "#00f0ff", onClick: exportActivePadWav });

  const cY = y + wavePanelH + 8, cH = h - wavePanelH - 8, colGap = 8, cW = (w - colGap * 2) / 3, sw = cW - 20;

  // Col 1
  drawGlassPanel(x, cY, cW, cH, "202 SAMPLER ENGINE + PITCH STEPPER");
  let sy = cY + 24, sx = x + 10;
  drawRubberBtn("grdBtn", sx, sy, sw - 108, 22, `GRADE: ${G[pad.grd].name}`, {
    active: true, color: "#00f0ff", onClick: () => { pushUndo("Change 202 Grade"); pad.grd = (pad.grd + 1) % 4; pad.sr = G[pad.grd].sr; pad.dirty = true; waveCacheDirty = true; }
  });
  drawRubberBtn("lpBtn", sx + sw - 102, sy, 48, 22, "LOOP", { active: pad.loop, color: "#00ff88", onClick: () => { pushUndo("Toggle Loop"); pad.loop = !pad.loop; } });
  drawRubberBtn("bypBtn", sx + sw - 50, sy, 50, 22, "BYP", { active: pad.bypass, color: "#ffaa00", onClick: () => { pushUndo("Toggle Bypass"); pad.bypass = !pad.bypass; pad.dirty = true; waveCacheDirty = true; } });
  sy += 27;

  const stNow = Math.round(12 * Math.log2(pad.pt)), stLbl = stNow > 0 ? `+${stNow} ST` : `${stNow} ST`, stBtnW = Math.floor((sw - 12) / 3);
  drawRubberBtn("ptDn", sx, sy, stBtnW, 20, "-1 ST", { color: "#00f0ff", onClick: () => stepPadSemitone(pad, -1) });
  drawRubberBtn("ptRst", sx + stBtnW + 6, sy, stBtnW, 20, stLbl, { active: stNow !== 0, color: "#00ffcc", onClick: () => { pushUndo("Reset Pitch"); pad.pt = 1; pad.dirty = true; waveCacheDirty = seqCacheDirty = true; } });
  drawRubberBtn("ptUp", sx + (stBtnW + 6) * 2, sy, sw - (stBtnW + 6) * 2, 20, "+1 ST", { color: "#00f0ff", onClick: () => stepPadSemitone(pad, 1) });
  sy += 25;

  const sStep = Math.min(38, (cY + cH - sy - 4) / 5);
  drawSlider("slSR", sx, sy, sw, 24, "SAMPLE RATE", pad.sr, 2000, 44100, `${Math.round(pad.sr)} Hz`, v => { pad.sr = Math.round(v); pad.dirty = true; waveCacheDirty = true; }); sy += sStep;
  drawSlider("slPT", sx, sy, sw, 24, "PITCH / SPEED", pad.pt, 0.25, 2.5, `${pad.pt.toFixed(3)}x`, v => { pad.pt = v; const o = getPadOrigBpm(pad); if (o) pad.tgtBpm = Math.round(o * pad.pt); pad.dirty = true; waveCacheDirty = seqCacheDirty = true; }); sy += sStep;
  drawSlider("slDRV", sx, sy, sw, 24, "PREAMP DRIVE", pad.drv, 0.5, 3.5, pad.drv.toFixed(2), v => { pad.drv = v; pad.dirty = true; waveCacheDirty = true; }); sy += sStep;
  drawSlider("slST", sx, sy, sw, 24, "TRIM START", pad.st, 0, 0.99, `${(pad.st * 100).toFixed(1)}%`, v => { pad.st = Math.min(pad.en - 0.004, v); pad.dirty = true; ovCacheDirty = waveCacheDirty = true; }, { color: "#00f0ff", locked: pad.lockSE }); sy += sStep;
  drawSlider("slEN", sx, sy, sw, 24, "TRIM END", pad.en, 0.01, 1, `${(pad.en * 100).toFixed(1)}%`, v => { pad.en = Math.max(pad.st + 0.004, v); pad.dirty = true; ovCacheDirty = waveCacheDirty = true; }, { color: "#ff2a85", locked: pad.lockSE });

  // Col 2
  const c2X = x + cW + colGap;
  drawGlassPanel(c2X, cY, cW, cH, "SP-202 FX (24dB FILTER + RING MOD)");
  let fy = cY + 24, fx = c2X + 10;
  const fStep = Math.min(36, (cH - 86) / 4);
  drawRubberBtn("fltMode", fx, fy, sw, 22, `FILTER: ${FMODES[pad.fMode]}`, { active: pad.fMode > 0, color: "#00ffcc", onClick: () => { pushUndo("Change Filter"); pad.fMode = (pad.fMode + 1) % 4; pad.dirty = true; waveCacheDirty = true; } }); fy += 27;
  drawSlider("slCut", fx, fy, sw, 24, "FILTER CUT", pad.fCutNorm, 0, 1, `${pad.fCutHz} Hz`, v => { pad.fCutNorm = v; pad.fCutHz = Math.round(logMap(v, 35, 16000)); pad.dirty = true; }, { color: "#00ffcc" }); fy += fStep;
  drawSlider("slRes", fx, fy, sw, 24, "FILTER RES", pad.fRes, 0, 1, `${Math.round(pad.fRes * 100)}%`, v => { pad.fRes = v; pad.dirty = true; }, { color: "#00ffcc" }); fy += fStep + 4;
  drawRubberBtn("rmBtn", fx, fy, sw, 22, pad.rmOn ? "RING MOD: ON" : "RING MOD: OFF", { active: pad.rmOn, color: "#ff2a85", onClick: () => { pushUndo("Toggle Ring Mod"); pad.rmOn = !pad.rmOn; pad.dirty = true; waveCacheDirty = true; } }); fy += 27;
  drawSlider("slRmF", fx, fy, sw, 24, "RING FREQ", pad.rmFreqNorm, 0, 1, `${pad.rmFreqHz} Hz`, v => { pad.rmFreqNorm = v; pad.rmFreqHz = Math.round(logMap(v, 20, 2500)); pad.dirty = true; }, { color: "#ff2a85" }); fy += fStep;
  drawSlider("slRmM", fx, fy, sw, 24, "RING MIX", pad.rmMix, 0, 1, `${Math.round(pad.rmMix * 100)}%`, v => { pad.rmMix = v; pad.dirty = true; }, { color: "#ff2a85" });

  // Col 3
  const c3X = x + (cW + colGap) * 2, dx = c3X + 10, dlyH = Math.min(126, Math.floor(cH * 0.44));
  drawGlassPanel(c3X, cY, cW, dlyH, "SP-202 LO-FI DELAY");
  let dy = cY + 24;
  drawRubberBtn("dlBtn", dx, dy, sw, 20, pad.dlOn ? "DELAY: ON" : "DELAY: OFF", { active: pad.dlOn, color: "#bb66ff", onClick: () => { pushUndo("Toggle Delay"); pad.dlOn = !pad.dlOn; pad.dirty = true; waveCacheDirty = true; } }); dy += 25;
  const dStep = Math.min(34, (dlyH - 52) / 2);
  drawSlider("slDlT", dx, dy, sw, 24, "DELAY TIME", pad.dlTime, 0.02, 1, `${Math.round(pad.dlTime * 1000)} ms`, v => { pad.dlTime = v; pad.dirty = true; }, { color: "#bb66ff" }); dy += dStep;
  drawSlider("slDlA", dx, dy, sw, 24, "DELAY AMOUNT", pad.dlAmt, 0, 1, `${Math.round(pad.dlAmt * 100)}%`, v => { pad.dlAmt = v; pad.dirty = true; }, { color: "#bb66ff" });

  const bpmY = cY + dlyH + 8, bpmH = cH - dlyH - 8;
  drawGlassPanel(c3X, bpmY, cW, bpmH, "LOOP BPM CALCULATOR (PITCH-LINKED)", "rgba(0, 255, 170, 0.35)");
  const orig = getPadOrigBpm(pad);
  let by = bpmY + 25;
  drawRubberBtn("btBtn", dx, by, sw * 0.52, 22, `BEATS: ${pad.beats}`, { color: "#00ffcc", onClick: () => { pushUndo("Change Beats"); pad.beats = BEATS_OPT[(BEATS_OPT.indexOf(pad.beats) + 1) % BEATS_OPT.length]; pad.dirty = true; } });
  ctx.fillStyle = "#88e8ff"; ctx.font = "bold 10px monospace"; ctx.fillText(`ORIG: ${orig ? orig.toFixed(1) : "--"}`, dx + sw * 0.56, by + 15);
  by += 28;

  drawRubberBtn("bpmDn", dx, by, 48, 26, "-1 BPM", { color: "#00f0ff", onClick: () => { pushUndo("Pad BPM -1"); fitPadToBpm(pad, (orig ? Math.round(orig * pad.pt) : pad.tgtBpm) - 1); waveCacheDirty = seqCacheDirty = true; } });
  ctx.fillStyle = "rgba(4,10,20,0.88)"; rrect(ctx, dx + 54, by, sw - 108, 26, 6); ctx.fill();
  ctx.strokeStyle = "rgba(0,255,170,0.45)"; rrect(ctx, dx + 54.5, by + 0.5, sw - 109, 25, 6); ctx.stroke();
  ctx.fillStyle = "#00ffcc"; ctx.font = "bold 13px monospace"; ctx.textAlign = "center";
  ctx.fillText(`${orig ? Math.round(orig * pad.pt) : pad.tgtBpm} BPM`, dx + sw / 2, by + 17);
  ctx.textAlign = "left";
  drawRubberBtn("bpmUp", dx + sw - 48, by, 48, 26, "+1 BPM", { color: "#00f0ff", onClick: () => { pushUndo("Pad BPM +1"); fitPadToBpm(pad, (orig ? Math.round(orig * pad.pt) : pad.tgtBpm) + 1); waveCacheDirty = seqCacheDirty = true; } });
  by += 32;
  drawRubberBtn("syncSeq", dx, by, sw, Math.min(24, bpmY + bpmH - by - 6), `SYNC TO SONG BPM (${seqBpm})`, {
    color: "#00ff88", onClick: () => { pushUndo("Sync Pad BPM"); fitPadToBpm(pad, seqBpm); waveCacheDirty = seqCacheDirty = true; statusMsg = `PAD ${activePad + 1} LOCKED TO ${seqBpm} BPM`; }
  });
}

// --- TAB 3: 64-BAR ZOOMABLE SONG TIMELINE ---
function drawTimelineTab(x, y, w, h) {
  const tbH = 74;
  drawGlassPanel(x, y, w, tbH, "SONG TIMELINE (CLICK CLIP=DRAG // DRAG EMPTY=PAINT // CTRL+X CUT // CTRL+Z UNDO // CLR=DEL SEL)");
  let bx = x + 10, by = y + 23;
  drawRubberBtn("sPlay", bx, by, 56, 22, "▶ PLAY", { active: seqRunning, color: "#00ff88", onClick: startSeq }); bx += 60;
  drawRubberBtn("sStop", bx, by, 46, 22, "■ STOP", { color: "#ff4466", onClick: stopSeq }); bx += 50;
  drawRubberBtn("sLoop", bx, by, 42, 22, "LOOP", { active: seqLoopOn, color: "#00ff88", onClick: () => { pushUndo("Toggle Loop"); seqLoopOn = !seqLoopOn; seqCacheDirty = true; } }); bx += 46;
  drawRubberBtn("sBpmDn", bx, by, 20, 22, "-", { onClick: () => setSeqBpm(seqBpm - 1) }); bx += 22;
  ctx.fillStyle = "#00ffcc"; ctx.font = "bold 10px monospace"; ctx.fillText(`${seqBpm}BPM`, bx + 2, by + 15); bx += 42;
  drawRubberBtn("sBpmUp", bx, by, 20, 22, "+", { onClick: () => setSeqBpm(seqBpm + 1) }); bx += 24;
  drawRubberBtn("sBars", bx, by, 54, 22, `${seqBars} BAR`, { onClick: () => setSeqBars(BARS_OPT[(BARS_OPT.indexOf(seqBars) + 1) % BARS_OPT.length]) }); bx += 58;

  drawRubberBtn("sToolP", bx, by, 50, 22, "PAINT", {
    active: seqTool === "paint", color: "#00f0ff",
    onClick: () => { seqTool = "paint"; statusMsg = "PAINT / DRAG MODE (CLICK CLIP TO MOVE, DRAG EMPTY TO PAINT END-TO-END)"; }
  }); bx += 53;
  drawRubberBtn("sToolS", bx, by, 54, 22, "SELECT", {
    active: seqTool === "select", color: "#00ffcc",
    onClick: () => { seqTool = "select"; statusMsg = "RECTANGLE SELECT MODE: DRAG BOX OVER CLIPS -> CTRL+X / CTRL+C / CTRL+V"; }
  }); bx += 57;
  drawRubberBtn("sCopy", bx, by, 42, 22, "COPY", { active: !!seqSel, color: "#00ffcc", onClick: copySeqSelection }); bx += 45;
  drawRubberBtn("sPaste", bx, by, 46, 22, "PASTE", { active: !!seqClipboard, color: "#ffaa00", onClick: () => pasteSeqClipboard() }); bx += 50;

  drawRubberBtn("sAddSt", bx, by, 52, 22, "+ STEP", { color: "#ffaa00", onClick: () => { pushUndo("Add Step Track"); seqTracks.push(makeSeqTrack("step", 0)); seqCacheDirty = true; } }); bx += 55;
  drawRubberBtn("sAddLp", bx, by, 52, 22, "+ LOOP", { color: "#00f0ff", onClick: () => { pushUndo("Add Loop Track"); seqTracks.push(makeSeqTrack("loop", activePad)); seqCacheDirty = true; } }); bx += 55;
  drawRubberBtn("sClr", bx, by, 36, 22, "CLR", { active: !!seqSel, color: "#ff4466", onClick: clearSelectionOrSong });
  drawRubberBtn("sExp", x + w - 82, by, 72, 22, "EXPORT", { color: "#00f0ff", onClick: exportTimelineWav });

  const brY = y + 49; let brX = x + 10;
  ctx.fillStyle = "#ffaa00"; ctx.font = "bold 10px monospace"; ctx.fillText("SNAP:", brX, brY + 13); brX += 34;
  for (let i = 0; i < SEQ_SNAPS.length; i++) {
    const sp = SEQ_SNAPS[i];
    drawRubberBtn("snap_" + i, brX, brY, 52, 18, sp.short, {
      active: seqSnapIdx === i, color: "#ffaa00",
      onClick: () => { seqSnapIdx = i; seqCacheDirty = true; statusMsg = `QUANTIZE SNAP: ${sp.label}`; }
    });
    brX += 55;
  }
  brX += 8;
  ctx.fillStyle = "#88ccff"; ctx.font = "bold 10px monospace"; ctx.fillText("PAT:", brX, brY + 13); brX += 30;
  for (let p = 1; p <= 8; p++) {
    drawRubberBtn("br_" + p, brX, brY, 26, 18, `P${p}`, { active: seqBrushPat === p, color: PAT_COLS[p - 1], onClick: () => { seqBrushPat = p; seqTool = "paint"; } });
    brX += 29;
  }
  drawRubberBtn("br_0", brX, brY, 38, 18, "ERS", { active: seqBrushPat === 0, color: "#ff4466", onClick: () => { seqBrushPat = 0; seqTool = "paint"; } }); brX += 44;
  if (x + w - brX > 95) drawSlider("seqSw", brX, brY - 5, Math.min(135, x + w - brX - 10), 22, "SWING", stepSwing, 0, 1, `${Math.round(stepSwing * 100)}%`, v => { stepSwing = v; });

  const gridY = y + tbH + 6, gridH = Math.max(170, Math.floor((h - tbH - 34) * 0.56));
  const gx = x + 6, gw = w - 12;
  seqGridRect = { x: gx, y: gridY, w: gw, h: gridH };
  seqLoopRect = { x: gx + SEQ_GRID_X, y: gridY, w: gw - SEQ_GRID_X, h: SEQ_LOOP_H };
  seqScrubRect = { x: gx + SEQ_GRID_X, y: gridY + SEQ_LOOP_H, w: gw - SEQ_GRID_X, h: SEQ_SCRUB_H };

  if (seqCacheDirty || seqCacheCv.width !== Math.floor(gw) || seqCacheCv.height !== Math.floor(gridH)) renderSeqCache(Math.floor(gw), Math.floor(gridH));
  ctx.drawImage(seqCacheCv, gx, gridY);

  dropZones.push({
    x: gx, y: gridY + SEQ_TOP_H, w: gw, h: gridH - SEQ_TOP_H,
    onDrop: (f, dx, dy) => {
      const rowH = (gridH - SEQ_TOP_H) / Math.max(1, seqTracks.length);
      const t = Math.floor((dy - (gridY + SEQ_TOP_H)) / rowH);
      loadFileToPad((t >= 0 && t < seqTracks.length && seqTracks[t].mode === "loop") ? seqTracks[t].padIdx : activePad, f, false);
    }
  });

  // Live 6-Segment LED VU Meters (Directly from Real-Time DSP Loop)
  const rowH = (gridH - SEQ_TOP_H) / Math.max(1, seqTracks.length), ledCnt = 6;
  for (let t = 0; t < seqTracks.length; t++) {
    const trk = seqTracks[t];
    const peak = seqRunning ? trk.vuPeak : 0;
    trk.vuLevel = Math.max(peak, trk.vuLevel * 0.82);
    const lit = Math.min(ledCnt, Math.ceil(trk.vuLevel * 7.5));
    const yBase = gridY + SEQ_TOP_H + t * rowH + rowH - 3, ledH = Math.max(2, (rowH - 12) / ledCnt);
    for (let s = 0; s < ledCnt; s++) {
      const ly = yBase - (s + 1) * (ledH + 1);
      ctx.fillStyle = s < lit ? (s >= 5 ? "#ff3333" : (s >= 3 ? "#ffcc00" : "#00ff66")) : "#152030";
      ctx.fillRect(gx + SEQ_HDR_W + 4, ly, SEQ_VU_W - 8, ledH);
    }
  }

  const visBars = seqBars / seqZoom, startBarF = seqScroll * seqBars;
  const gridBodyW = gw - SEQ_GRID_X;
  const barToScreenX = b => gx + SEQ_GRID_X + ((b - startBarF) / visBars) * gridBodyW;

  if (seqSel) {
    ctx.save();
    ctx.beginPath(); ctx.rect(gx + SEQ_GRID_X, gridY + SEQ_TOP_H, gridBodyW, gridH - SEQ_TOP_H); ctx.clip();
    const sx0 = barToScreenX(seqSel.k0 / TICKS_PER_BAR);
    const sx1 = barToScreenX(seqSel.k1 / TICKS_PER_BAR);
    const sy0 = gridY + SEQ_TOP_H + seqSel.t0 * rowH;
    const sy1 = gridY + SEQ_TOP_H + (seqSel.t1 + 1) * rowH;
    const sw = Math.max(4, sx1 - sx0), sh = Math.max(4, sy1 - sy0);

    ctx.fillStyle = "rgba(0, 240, 255, 0.14)";
    ctx.fillRect(sx0, sy0, sw, sh);
    ctx.strokeStyle = "#00f0ff";
    ctx.lineWidth = 1.6;
    ctx.setLineDash([5, 3]);
    ctx.strokeRect(sx0 + 0.5, sy0 + 0.5, sw - 1, sh - 1);
    ctx.setLineDash([]);

    ctx.fillStyle = "#00f0ff";
    ctx.fillRect(sx0 - 2, sy0 - 2, 5, 5);
    ctx.fillRect(sx0 + sw - 3, sy0 - 2, 5, 5);
    ctx.fillRect(sx0 - 2, sy0 + sh - 3, 5, 5);
    ctx.fillRect(sx0 + sw - 3, sy0 + sh - 3, 5, 5);

    const selBeats = ((seqSel.k1 - seqSel.k0) / 2).toFixed(1);
    const tag = `GROUP: ${selBeats}B × ${seqSel.t1 - seqSel.t0 + 1}T [CTRL+X / CTRL+C / DEL]`;
    ctx.font = "bold 9px monospace";
    const tw = ctx.measureText(tag).width + 10;
    ctx.fillStyle = "rgba(4, 14, 26, 0.88)";
    ctx.fillRect(Math.max(gx + SEQ_GRID_X + 2, sx0), Math.max(gridY + SEQ_TOP_H + 2, sy0 - 14), tw, 13);
    ctx.fillStyle = "#00ffcc";
    ctx.fillText(tag, Math.max(gx + SEQ_GRID_X + 6, sx0 + 4), Math.max(gridY + SEQ_TOP_H + 11, sy0 - 4));
    ctx.restore();
  }

  const playBarF = getSeqPlayheadBarF();
  const px = barToScreenX(playBarF);
  if (px >= gx + SEQ_GRID_X - 2 && px <= gx + gw + 2) {
    ctx.strokeStyle = seqRunning ? "#ffffff" : "#00f0ff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px, gridY + SEQ_LOOP_H); ctx.lineTo(px, gridY + gridH); ctx.stroke();
    ctx.fillStyle = seqRunning ? "#00ffaa" : "#00f0ff";
    ctx.beginPath(); ctx.moveTo(px, gridY + SEQ_TOP_H); ctx.lineTo(px - 6, gridY + SEQ_LOOP_H + 2); ctx.lineTo(px + 6, gridY + SEQ_LOOP_H + 2); ctx.closePath(); ctx.fill();
  }

  const sSbY = gridY + gridH + 5, sSbH = 16;
  drawRubberBtn("szIn", gx, sSbY, 34, sSbH, "Z+", { onClick: () => setSeqZoom(seqZoom * 1.5) });
  drawRubberBtn("szOut", gx + 38, sSbY, 34, sSbH, "Z-", { onClick: () => setSeqZoom(seqZoom / 1.5) });
  drawRubberBtn("sz1x", gx + 76, sSbY, 34, sSbH, "1x", { onClick: () => { seqZoom = 1; seqScroll = 0; seqCacheDirty = true; } });

  const sLBtnX = gx + SEQ_GRID_X;
  drawRubberBtn("sScrL", sLBtnX, sSbY, 22, sSbH, "◀", { onClick: () => { seqScroll -= (1 / seqZoom) * 0.25; clampSeqView(); seqCacheDirty = true; } });
  drawRubberBtn("sScrR", gx + gw - 22, sSbY, 22, sSbH, "▶", { onClick: () => { seqScroll += (1 / seqZoom) * 0.25; clampSeqView(); seqCacheDirty = true; } });

  const sTrkX = sLBtnX + 26, sTrkW = (gx + gw - 26) - sTrkX;
  seqHScrRect = { x: sTrkX, y: sSbY, w: sTrkW, h: sSbH };
  ctx.fillStyle = "rgba(4, 8, 16, 0.85)"; rrect(ctx, sTrkX, sSbY, sTrkW, sSbH, 5); ctx.fill();
  ctx.strokeStyle = "rgba(0, 240, 255, 0.22)"; rrect(ctx, sTrkX + 0.5, sSbY + 0.5, sTrkW - 1, sSbH - 1, 5); ctx.stroke();

  const sThumbW = Math.max(30, sTrkW * (1 / seqZoom)), sMaxOff = Math.max(0.00001, 1 - 1 / seqZoom);
  const sThumbX = sTrkX + (seqZoom > 1.001 ? (seqScroll / sMaxOff) * (sTrkW - sThumbW) : 0);
  seqHThumbRect = { x: sThumbX, y: sSbY + 2, w: sThumbW, h: sSbH - 4 };
  ctx.fillStyle = seqZoom > 1.001 ? "rgba(0, 240, 255, 0.65)" : "rgba(110, 140, 170, 0.28)";
  rrect(ctx, sThumbX + 1, sSbY + 2, sThumbW - 2, sSbH - 4, 4); ctx.fill();

  const mixY = sSbY + sSbH + 6, mixH = y + h - mixY;
  drawGlassPanel(x, mixY, w, mixH, "LIVE REAL-TIME MIXER (STEP & LOOP TRACKS)");
  const mRowH = Math.min(25, (mixH - 26) / Math.max(1, seqTracks.length));
  for (let t = 0; t < seqTracks.length; t++) {
    const trk = seqTracks[t], ry = mixY + 22 + t * mRowH, col = TRK_COLS[t % TRK_COLS.length];
    if (ry + mRowH > mixY + mixH - 2) break;
    ctx.fillStyle = col; ctx.font = "bold 10px monospace";
    ctx.fillText(`T${t + 1} ${trk.mode === "step" ? "[STEP]" : "[LOOP]"}`, x + 10, ry + 14);
    if (trk.mode === "loop") {
      drawRubberBtn(`mSrc_${t}`, x + 94, ry + 2, 134, mRowH - 4, `PAD ${trk.padIdx + 1}: ${pads[trk.padIdx].name.slice(0, 8)}`, { onClick: () => { pushUndo("Change Track Pad"); trk.padIdx = (trk.padIdx + 1) % 8; seqCacheDirty = true; } });
    } else {
      drawRubberBtn(`mSrc_${t}`, x + 94, ry + 2, 134, mRowH - 4, "STEP SEQ (P1-P8)", { color: "#ffaa00", onClick: () => switchTab("step") });
    }
    const slW = Math.max(90, w - 456);
    drawSlider(`mVol_${t}`, x + 236, ry - 4, slW, mRowH, "", trk.vol, 0, 1.25, `${Math.round(trk.vol * 100)}%`, v => { trk.vol = v; }, { color: col });
    let ax = x + 246 + slW;
    drawRubberBtn(`mMut_${t}`, ax, ry + 2, 42, mRowH - 4, "MUTE", { active: trk.mute, color: "#ff3355", onClick: () => { pushUndo("Toggle Track Mute"); trk.mute = !trk.mute; seqCacheDirty = true; } }); ax += 46;
    drawRubberBtn(`mFil_${t}`, ax, ry + 2, 42, mRowH - 4, "FILL", {
      onClick: () => {
        pushUndo(`Fill Track ${t + 1}`);
        const val = trk.mode === "step" ? (seqBrushPat || 1) : 1;
        const stepK = getClipSpanTicks(trk);
        trk.cells.fill(0);
        for (let k = 0; k < seqBars * TICKS_PER_BAR; k += stepK) trk.cells[k] = val;
        seqCacheDirty = true;
      }
    }); ax += 46;
    drawRubberBtn(`mClr_${t}`, ax, ry + 2, 38, mRowH - 4, "CLR", { onClick: () => { pushUndo(`Clear Track ${t + 1}`); trk.cells.fill(0); seqCacheDirty = true; } }); ax += 42;
    if (seqTracks.length > 1) {
      drawRubberBtn(`mDel_${t}`, ax, ry + 2, 26, mRowH - 4, "X", { color: "#ff4466", onClick: () => { pushUndo(`Delete Track ${t + 1}`); stopAllVoices(false); seqTracks.splice(t, 1); seqCacheDirty = true; } });
    }
  }
}

// --- TAB 4: 8-PATTERN STEP SEQUENCER + STEP PITCHER ---
const ST_HDR_W = 134, ST_TOP_H = 24;
function drawStepTab(x, y, w, h) {
  const tbH = 54;
  const modeHint = stepEditMode === "pitch" ? "DRAG STEP UP/DOWN FOR -12/+12 ST // RIGHT-CLICK RESET" : "DBL-CLICK TRACK TITLE -> WAVE EDITOR // CLICK/DRAG STEPS";
  drawGlassPanel(x, y, w, tbH, `STEP SEQUENCER // PATTERN P${activeStepPat + 1} // ${modeHint}`);
  let bx = x + 10, by = y + 25;
  for (let i = 0; i < 8; i++) {
    drawRubberBtn("sp_" + i, bx, by, 30, 22, `P${i + 1}`, { active: activeStepPat === i, color: PAT_COLS[i], onClick: () => { activeStepPat = i; } });
    bx += 34;
  }
  bx += 6;
  drawRubberBtn("stPlay", bx, by, 62, 22, "▶ PLAY", { active: stepRunning, color: "#00ff88", onClick: startStepPat }); bx += 66;
  drawRubberBtn("stStop", bx, by, 50, 22, "■ STOP", { color: "#ff4466", onClick: stopStepPat }); bx += 56;
  drawRubberBtn("stMode", bx, by, 98, 22, stepEditMode === "pitch" ? "MODE: PITCH" : "MODE: STEPS", {
    active: stepEditMode === "pitch", color: "#ffaa00",
    onClick: () => { stepEditMode = stepEditMode === "trig" ? "pitch" : "trig"; statusMsg = stepEditMode === "pitch" ? "STEP PITCHER ACTIVE" : "STEP TRIGGER MODE"; }
  }); bx += 104;
  drawRubberBtn("stCpy", bx, by, 40, 22, "COPY", { onClick: () => { stepClip = stepPats[activeStepPat].map(r => new Uint8Array(r)); stepPitchClip = stepPitches[activeStepPat].map(r => new Int8Array(r)); statusMsg = `COPIED PATTERN P${activeStepPat + 1}`; } }); bx += 44;
  drawRubberBtn("stPst", bx, by, 44, 22, "PASTE", { onClick: () => { if (stepClip) { pushUndo("Paste Pattern"); stepPats[activeStepPat] = stepClip.map(r => new Uint8Array(r)); stepPitches[activeStepPat] = stepPitchClip.map(r => new Int8Array(r)); seqCacheDirty = true; } } }); bx += 48;
  drawRubberBtn("stRnd", bx, by, 44, 22, "RAND", { onClick: () => { pushUndo("Randomize Pattern"); const pat = stepPats[activeStepPat]; for (let p = 0; p < 8; p++) for (let s = 0; s < 16; s++) pat[p][s] = (pads[p].rawBuf && Math.random() < (s % 4 === 0 ? 0.55 : 0.2)) ? 1 : 0; seqCacheDirty = true; } }); bx += 48;
  drawRubberBtn("stClr", bx, by, 38, 22, "CLR", { onClick: () => { pushUndo("Clear Pattern"); stepPats[activeStepPat].forEach(r => r.fill(0)); stepPitches[activeStepPat].forEach(r => r.fill(0)); seqCacheDirty = true; } }); bx += 46;
  if (x + w - bx > 96) drawSlider("stSw", bx, by - 4, Math.min(140, x + w - bx - 10), 22, "SWING", stepSwing, 0, 1, `${Math.round(stepSwing * 100)}%`, v => { stepSwing = v; });

  const gy = y + tbH + 8, gh = h - tbH - 8;
  drawGlassPanel(x, gy, w, gh);
  const gx = x + 10, ggy = gy + 10, gw = w - 20, ggh = gh - 20;
  stepGridRect = { x: gx, y: ggy, w: gw, h: ggh };

  dropZones.push({
    x: gx, y: ggy, w: gw, h: ggh,
    onDrop: (f, dx, dy) => {
      const p = Math.floor((dy - (ggy + ST_TOP_H)) / ((ggh - ST_TOP_H) / 8));
      loadFileToPad(p >= 0 && p < 8 ? p : activePad, f, false);
    }
  });

  const pat = stepPats[activeStepPat], pitches = stepPitches[activeStepPat];
  const colW = (gw - ST_HDR_W) / 16, rowH = (ggh - ST_TOP_H) / 8, pCol = PAT_COLS[activeStepPat];
  ctx.fillStyle = "rgba(4, 8, 16, 0.78)"; rrect(ctx, gx, ggy, gw, ggh, 6); ctx.fill();
  ctx.fillStyle = pCol; ctx.font = "bold 10px monospace"; ctx.fillText(`PAT P${activeStepPat + 1} // DBL-CLICK`, gx + 8, ggy + 16);

  for (let s = 0; s < 16; s++) {
    const sx = gx + ST_HDR_W + s * colW;
    if (s === stepDrawCur) { ctx.fillStyle = "rgba(0, 255, 170, 0.18)"; ctx.fillRect(sx, ggy, colW, ggh); }
    ctx.strokeStyle = s % 4 === 0 ? "rgba(0,240,255,0.34)" : "rgba(0,240,255,0.09)";
    ctx.beginPath(); ctx.moveTo(sx + 0.5, ggy); ctx.lineTo(sx + 0.5, ggy + ggh); ctx.stroke();
    ctx.fillStyle = s === stepDrawCur ? "#ffffff" : (s % 4 === 0 ? "#00ffcc" : "#557799");
    ctx.font = "10px monospace"; ctx.fillText(String(s + 1), sx + 6, ggy + 16);
  }

  for (let p = 0; p < 8; p++) {
    const py = ggy + ST_TOP_H + p * rowH;
    ctx.strokeStyle = "rgba(0,240,255,0.12)"; ctx.beginPath(); ctx.moveTo(gx, py + 0.5); ctx.lineTo(gx + gw, py + 0.5); ctx.stroke();
    ctx.fillStyle = pads[p].rawBuf ? TRK_COLS[p] : "#334455"; ctx.fillRect(gx + 3, py + 4, 4, rowH - 8);
    ctx.fillStyle = pads[p].rawBuf ? "#ddeeff" : "#556677"; ctx.font = "10px monospace";
    ctx.fillText(`P${p + 1}: ${pads[p].name.slice(0, 12)}`, gx + 12, py + rowH / 2 + 4);

    for (let s = 0; s < 16; s++) {
      const sx = gx + ST_HDR_W + s * colW, on = pat[p][s], semi = pitches[p][s];
      const bx2 = sx + 3, by2 = py + 4, bw2 = Math.max(6, colW - 6), bh2 = rowH - 8;
      ctx.fillStyle = on ? (stepEditMode === "pitch" ? "#263246" : pCol) : (Math.floor(s / 4) % 2 === 0 ? "#18202c" : "#111720");
      rrect(ctx, bx2, by2, bw2, bh2, 4); ctx.fill();

      if (on && (stepEditMode === "pitch" || semi !== 0)) {
        const midY = by2 + bh2 / 2, barH = (semi / 12) * (bh2 / 2 - 2);
        ctx.fillStyle = semi >= 0 ? "#00ffcc" : "#ff4488";
        if (semi >= 0) ctx.fillRect(bx2 + 2, midY - barH, bw2 - 4, Math.max(2, barH));
        else ctx.fillRect(bx2 + 2, midY, bw2 - 4, Math.max(2, -barH));
      }
      ctx.strokeStyle = on ? (stepEditMode === "pitch" ? "#ffaa00" : "#ffffff") : "rgba(255,255,255,0.1)";
      rrect(ctx, bx2 + 0.5, by2 + 0.5, bw2 - 1, bh2 - 1, 4); ctx.stroke();
      if (on && (stepEditMode === "pitch" || semi !== 0)) {
        ctx.fillStyle = stepEditMode === "pitch" ? "#ffffff" : "#000000";
        ctx.font = "bold 9px monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(semi > 0 ? `+${semi}` : String(semi), bx2 + bw2 / 2, by2 + bh2 / 2);
        ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
      }
    }
  }
}

// ==========================================
// 12. TAB SWITCHING & RENDER LOOP (0% IDLE CPU)
// ==========================================
function switchTab(tab) {
  if (activeTab === "edit" && tab !== "edit") stopEditorPlay();
  if (activeTab === "step" && tab === "seq") stopStepPat();
  activeTab = tab;
  openMenu = null;
  if (tab === "edit") { ovCacheDirty = waveCacheDirty = true; }
  if (tab === "seq") {
    pads.forEach(p => { if (p.rawBuf && !p.miniPeaks) p.miniPeaks = computeMiniPeaks(p.rawBuf); });
    seqCacheDirty = true;
  }
  requestDraw();
}

function requestDraw() { needRedraw = true; if (!rafId) rafId = requestAnimationFrame(tick); }
function ensureAnim() { if (!rafId) rafId = requestAnimationFrame(tick); }
function tick() {
  rafId = 0;
  const anyPadLit = pads.some(p => p.trigs.length > 0);
  const live = edPlaying || seqRunning || stepRunning || anyPadLit || activeDrag || activeSlider;
  if (needRedraw || live) { needRedraw = false; draw(); }
  if (live) rafId = requestAnimationFrame(tick);
}

// ==========================================
// 13. POINTER, CLIP DRAG, NON-OVERLAPPING PAINT & SHORTCUTS
// ==========================================
function updateSliderFromX(sl, px) {
  sl.onChange(sl.min + Math.max(0, Math.min(1, (px - sl.x) / sl.w)) * (sl.max - sl.min));
  requestDraw();
}
function panOverviewAt(px) {
  if (!ovRect) return;
  viewOffset = Math.max(0, Math.min(1, (px - ovRect.x) / ovRect.w)) - (1 / viewZoom) * 0.5;
  clampView(); waveCacheDirty = true; requestDraw();
}

function seqXToBarF(px) {
  if (!seqGridRect) return 0;
  const gx = seqGridRect.x + SEQ_GRID_X, gw = seqGridRect.w - SEQ_GRID_X;
  return seqScroll * seqBars + ((px - gx) / gw) * (seqBars / seqZoom);
}

function getSeqTrackAndTick(px, py) {
  if (!seqGridRect) return null;
  const gx = seqGridRect.x + SEQ_GRID_X, gy = seqGridRect.y + SEQ_TOP_H;
  const gw = seqGridRect.w - SEQ_GRID_X, gh = seqGridRect.h - SEQ_TOP_H;
  const snapTicks = SEQ_SNAPS[seqSnapIdx].ticks;
  const rawTick = Math.max(0, Math.min(seqBars * TICKS_PER_BAR - 1, Math.floor(seqXToBarF(px) * TICKS_PER_BAR)));
  const k = Math.max(0, Math.min(seqBars * TICKS_PER_BAR - snapTicks, Math.floor(rawTick / snapTicks) * snapTicks));
  const t = Math.max(0, Math.min(seqTracks.length - 1, Math.floor(((py - gy) / gh) * seqTracks.length)));
  return { t, k, rawTick, snapTicks };
}

function handleSeqCellInteract(px, py, isDrag, isRight, shiftKey, altKey) {
  if (!seqGridRect) return;
  const gx = seqGridRect.x + SEQ_GRID_X, gy = seqGridRect.y + SEQ_TOP_H;
  const gw = seqGridRect.w - SEQ_GRID_X, gh = seqGridRect.h - SEQ_TOP_H;
  if (px < gx || py < gy || px > gx + gw || py > gy + gh) return;

  const { t, k, rawTick, snapTicks } = getSeqTrackAndTick(px, py);
  const trk = seqTracks[t];
  const hitClip = findClipAtTick(trk, rawTick);

  if (isRight) {
    if (!isDrag) pushUndo("Delete Clip");
    if (hitClip) trk.cells[hitClip.startK] = 0;
    else trk.cells[k] = 0;
    if (!isDrag) activeDrag = { type: "seqErase" };
    statusMsg = `DELETED CLIP ON T${t + 1}`;
    seqCacheDirty = true; requestDraw(); return;
  }

  if (!isDrag) {
    const now = performance.now();
    const clickId = hitClip ? `clip_${t}_${hitClip.startK}` : `cell_${t}_${k}`;
    if (now - lastClick.t < 340 && lastClick.key === clickId) {
      lastClick.t = 0;
      activeDrag = null;
      if (trk.mode === "step") {
        const pNum = hitClip ? hitClip.val : (seqBrushPat || 1);
        activeStepPat = pNum - 1;
        switchTab("step");
      } else {
        activePad = trk.padIdx;
        switchTab("edit");
      }
      return;
    }
    lastClick = { t: now, key: clickId };
  }

  if (!isDrag && (seqTool === "select" || shiftKey)) {
    if (!shiftKey && seqSel && t >= seqSel.t0 && t <= seqSel.t1 && rawTick >= seqSel.k0 && rawTick < seqSel.k1) {
      pushUndo(altKey ? "Clone Group" : "Move Group");
      const items = [];
      for (let st = seqSel.t0; st <= seqSel.t1; st++) {
        for (let sk = seqSel.k0; sk < seqSel.k1; sk++) {
          if (seqTracks[st].cells[sk]) items.push({ dt: st - seqSel.t0, dk: sk - seqSel.k0, val: seqTracks[st].cells[sk] });
        }
      }
      const backup = seqTracks.map(tr => new Uint8Array(tr.cells));
      activeDrag = { type: "seqGroupMove", startT: t, startK: k, origSel: { ...seqSel }, items, backup, clone: !!altKey };
      statusMsg = altKey ? "CLONE-DRAGGING GROUPED CLIPS..." : "MOVING GROUPED CLIPS...";
      return;
    }
    seqSel = { t0: t, t1: t, k0: k, k1: k + snapTicks };
    seqPasteAnchor = { t, k };
    activeDrag = { type: "seqMarquee", anchorT: t, anchorK: k };
    seqCacheDirty = true;
    statusMsg = "DRAG RECTANGLE TO GROUP CLIPS -> CTRL+X / CTRL+C / CTRL+V / CLR";
    requestDraw();
    return;
  }

  if (!isDrag && hitClip && seqBrushPat !== 0) {
    pushUndo(altKey ? "Clone Clip" : "Move Clip");
    seqPasteAnchor = { t, k: hitClip.startK };
    activeDrag = {
      type: "seqMoveSingle",
      trackIdx: t,
      origK: hitClip.startK,
      curK: hitClip.startK,
      grabOffsetTicks: rawTick - hitClip.startK,
      val: hitClip.val,
      backup: new Uint8Array(trk.cells),
      clone: !!altKey
    };
    statusMsg = `DRAGGING CLIP ON T${t + 1} (DOUBLE-CLICK TO EDIT // RIGHT-CLICK TO DELETE)`;
    requestDraw();
    return;
  }

  if (!isDrag) {
    seqPasteAnchor = { t, k };
    if (seqBrushPat === 0) {
      pushUndo("Erase Clip");
      if (hitClip) trk.cells[hitClip.startK] = 0;
      else trk.cells[k] = 0;
      activeDrag = { type: "seqErase" };
      seqCacheDirty = true; requestDraw(); return;
    }
    pushUndo("Paint Clips");
    const val = trk.mode === "loop" ? 1 : (seqBrushPat || 1);
    const clipSpan = getClipSpanTicks(trk);
    trk.cells[k] = val;
    activeDrag = {
      type: "seqPaintChain",
      trackIdx: t,
      val,
      clipSpan,
      nextFreeK: k + clipSpan
    };
    statusMsg = `PAINTED CLIP AT BAR ${(k / TICKS_PER_BAR + 1).toFixed(2)} (DRAG RIGHT TO CHAIN AFTER FULL LENGTH)`;
    seqCacheDirty = true; requestDraw(); return;
  }
}

function handleStepGridInteract(px, py, isDrag, isRight) {
  if (!stepGridRect) return;
  const gx = stepGridRect.x, gy = stepGridRect.y + ST_TOP_H, gw = stepGridRect.w, gh = stepGridRect.h - ST_TOP_H;
  if (px < gx || py < gy || px > gx + gw || py > gy + gh) return;
  const p = Math.floor(((py - gy) / gh) * 8); if (p < 0 || p >= 8) return;

  if (px < gx + ST_HDR_W) {
    if (!isDrag && !isRight) {
      const now = performance.now();
      const key = `stepHdr_${p}`;
      if (now - lastClick.t < 340 && lastClick.key === key) {
        lastClick.t = 0;
        activePad = p;
        switchTab("edit");
        statusMsg = `OPENED PAD ${p + 1} IN WAVE EDITOR`;
        return;
      }
      lastClick = { t: now, key };
      triggerPad(p, false, 0, true);
    }
    return;
  }

  const s = Math.floor(((px - (gx + ST_HDR_W)) / (gw - ST_HDR_W)) * 16); if (s < 0 || s >= 16) return;
  const pat = stepPats[activeStepPat], pitches = stepPitches[activeStepPat];

  if (isRight) {
    pushUndo("Reset Step Pitch");
    pitches[p][s] = 0;
    statusMsg = `P${p + 1} STEP ${s + 1} PITCH RESET TO 0`;
    requestDraw(); return;
  }
  if (stepEditMode === "pitch") {
    if (!isDrag) {
      pushUndo("Adjust Step Pitch");
      pat[p][s] = 1;
      activeDrag = { type: "stepPitch", p, s, startY: py, startSemi: pitches[p][s] };
      if (pads[p].rawBuf) triggerPad(p, false, 0, true, Math.pow(2, pitches[p][s] / 12));
      seqCacheDirty = true; requestDraw();
    }
    return;
  }
  if (!isDrag) {
    pushUndo("Edit Steps");
    activeDrag = { type: "stepPaint", val: pat[p][s] ? 0 : 1 };
  }
  if (activeDrag && activeDrag.type === "stepPaint" && pat[p][s] !== activeDrag.val) {
    pat[p][s] = activeDrag.val; seqCacheDirty = true; requestDraw();
  }
}

cv.oncontextmenu = e => e.preventDefault();

cv.onmousedown = e => {
  mx = e.clientX; my = e.clientY;

  if (openMenu) {
    if (menuPanelRect && hit(menuPanelRect, mx, my)) {
      for (const it of menuItemRects) {
        if (!it.disabled && hit(it, mx, my)) {
          openMenu = null;
          it.action();
          requestDraw();
          return;
        }
      }
      return;
    }
    const clickedMenuBtn = (menuBtnRects.file && hit(menuBtnRects.file, mx, my)) || (menuBtnRects.edit && hit(menuBtnRects.edit, mx, my));
    if (!clickedMenuBtn) { openMenu = null; requestDraw(); }
  }

  if (e.button === 2) {
    if (activeTab === "seq" && seqGridRect && hit(seqGridRect, mx, my)) handleSeqCellInteract(mx, my, false, true, e.shiftKey, e.altKey);
    else if (activeTab === "step" && stepGridRect && hit(stepGridRect, mx, my)) handleStepGridInteract(mx, my, false, true);
    return;
  }
  down = true;

  for (let i = uiBtns.length - 1; i >= 0; i--) {
    if (hit(uiBtns[i], mx, my)) { pressedBtnId = uiBtns[i].id; uiBtns[i].onClick(); requestDraw(); return; }
  }
  for (let i = uiSliders.length - 1; i >= 0; i--) {
    if (hit(uiSliders[i], mx, my)) {
      pushUndo(`Adjust ${uiSliders[i].label}`);
      activeSlider = uiSliders[i];
      updateSliderFromX(activeSlider, mx);
      return;
    }
  }
  if (treeThumbRect && hit(treeThumbRect, mx, my)) { activeDrag = { type: "tscr", startY: my, startScroll: treeScroll }; return; }
  if (treeListRect && hit(treeListRect, mx, my)) {
    const item = treeFlat[Math.floor((my - treeListRect.y + treeScroll) / 21)];
    if (item) {
      if (item.type === "dir") {
        item.open = !item.open;
        if (item.open && !item.loaded) { item.loaded = true; readDirNodes(item.handle).then(ch => { item.children = ch; rebuildTreeFlat(); }); }
        else rebuildTreeFlat();
      } else activeDrag = { type: "treePress", item, sx: mx, sy: my };
    }
    return;
  }
  if (activeTab === "edit") {
    const pad = pads[activePad];
    if (ovRect && hit(ovRect, mx, my)) { activeDrag = { type: "ov" }; panOverviewAt(mx); return; }
    if (hScrRect && hit(hScrRect, mx, my)) {
      if (hThumbRect && hit(hThumbRect, mx, my)) activeDrag = { type: "hscr", startX: mx, startOff: viewOffset };
      else if (viewZoom > 1.001) { viewOffset = ((mx - hScrRect.x) / hScrRect.w) - (1 / viewZoom) * 0.5; clampView(); waveCacheDirty = true; requestDraw(); }
      return;
    }
    if (waveRect && hit(waveRect, mx, my) && pad && pad.rawBuf) {
      const viewSpan = 1 / viewZoom;
      const stX = waveRect.x + ((pad.st - viewOffset) / viewSpan) * waveRect.w;
      const enX = waveRect.x + ((pad.en - viewOffset) / viewSpan) * waveRect.w;
      if (!pad.lockSE) {
        if (Math.abs(mx - stX) <= 16) { pushUndo("Trim Start"); activeDrag = { type: "st" }; return; }
        if (Math.abs(mx - enX) <= 16) { pushUndo("Trim End"); activeDrag = { type: "en" }; return; }
      }
      startEditorPlay(Math.max(0, Math.min(1, viewOffset + ((mx - waveRect.x) / waveRect.w) * viewSpan)));
      return;
    }
  }
  if (activeTab === "seq") {
    if (seqHScrRect && hit(seqHScrRect, mx, my)) {
      if (seqHThumbRect && hit(seqHThumbRect, mx, my)) activeDrag = { type: "seqHscr", startX: mx, startOff: seqScroll };
      else if (seqZoom > 1.001) { seqScroll = ((mx - seqHScrRect.x) / seqHScrRect.w) - (1 / seqZoom) * 0.5; clampSeqView(); seqCacheDirty = true; requestDraw(); }
      return;
    }
    if (seqLoopRect && hit(seqLoopRect, mx, my)) {
      pushUndo("Adjust Loop Region");
      const visBars = seqBars / seqZoom, startBarF = seqScroll * seqBars;
      const barToX = b => seqLoopRect.x + ((b - startBarF) / visBars) * seqLoopRect.w;
      const lx0 = barToX(seqLoopStart), lx1 = barToX(seqLoopEnd);
      const snapBars = SEQ_SNAPS[seqSnapIdx].ticks / TICKS_PER_BAR;
      seqLoopOn = true;
      if (Math.abs(mx - lx0) <= 10) activeDrag = { type: "seqLoopL" };
      else if (Math.abs(mx - lx1) <= 10) activeDrag = { type: "seqLoopR" };
      else if (mx > lx0 && mx < lx1) activeDrag = { type: "seqLoopMove", startBarF: seqXToBarF(mx), origStart: seqLoopStart, origLen: seqLoopEnd - seqLoopStart };
      else {
        const b = Math.max(0, Math.min(seqBars - snapBars, Math.floor(seqXToBarF(mx) / snapBars) * snapBars));
        seqLoopStart = b; seqLoopEnd = Math.min(seqBars, b + snapBars);
        activeDrag = { type: "seqLoopR" };
      }
      seqCacheDirty = true; requestDraw(); return;
    }
    if (seqScrubRect && hit(seqScrubRect, mx, my)) {
      activeDrag = { type: "seqScrub" };
      scrubSeqToBarF(seqXToBarF(mx));
      return;
    }
    if (seqGridRect && hit(seqGridRect, mx, my)) {
      handleSeqCellInteract(mx, my, false, false, e.shiftKey, e.altKey);
      return;
    }
  }
  if (activeTab === "step" && stepGridRect && hit(stepGridRect, mx, my)) { handleStepGridInteract(mx, my, false, false); return; }
};

window.addEventListener("mousemove", e => {
  mx = e.clientX; my = e.clientY;
  if (openMenu) {
    if (openMenu === "file" && menuBtnRects.edit && hit(menuBtnRects.edit, mx, my)) { openMenu = "edit"; requestDraw(); return; }
    if (openMenu === "edit" && menuBtnRects.file && hit(menuBtnRects.file, mx, my)) { openMenu = "file"; requestDraw(); return; }
  }
  if (activeSlider) { updateSliderFromX(activeSlider, mx); return; }
  if (activeDrag) {
    const pad = pads[activePad];
    const snapTicks = SEQ_SNAPS[seqSnapIdx].ticks;
    const snapBars = snapTicks / TICKS_PER_BAR;
    if (activeDrag.type === "treePress") {
      if (Math.hypot(mx - activeDrag.sx, my - activeDrag.sy) > 6) activeDrag = { type: "treeDrag", name: activeDrag.item.name, fileFn: activeDrag.item.fileFn };
    } else if (activeDrag.type === "ov") panOverviewAt(mx);
    else if (activeDrag.type === "hscr" && hScrRect && hThumbRect && viewZoom > 1.001) {
      viewOffset = activeDrag.startOff + ((mx - activeDrag.startX) / Math.max(1, hScrRect.w - hThumbRect.w)) * (1 - 1 / viewZoom);
      clampView(); waveCacheDirty = true;
    } else if (activeDrag.type === "seqHscr" && seqHScrRect && seqHThumbRect && seqZoom > 1.001) {
      seqScroll = activeDrag.startOff + ((mx - activeDrag.startX) / Math.max(1, seqHScrRect.w - seqHThumbRect.w)) * (1 - 1 / seqZoom);
      clampSeqView(); seqCacheDirty = true;
    } else if (activeDrag.type === "seqLoopL") {
      const v = Math.round(seqXToBarF(mx) / snapBars) * snapBars;
      seqLoopStart = Math.max(0, Math.min(seqLoopEnd - snapBars, v));
      seqCacheDirty = true; statusMsg = `LOOP REGION: BARS ${(seqLoopStart + 1).toFixed(2)} - ${seqLoopEnd.toFixed(2)}`;
    } else if (activeDrag.type === "seqLoopR") {
      const v = Math.round(seqXToBarF(mx) / snapBars) * snapBars;
      seqLoopEnd = Math.max(seqLoopStart + snapBars, Math.min(seqBars, v));
      seqCacheDirty = true; statusMsg = `LOOP REGION: BARS ${(seqLoopStart + 1).toFixed(2)} - ${seqLoopEnd.toFixed(2)}`;
    } else if (activeDrag.type === "seqLoopMove") {
      const delta = Math.round((seqXToBarF(mx) - activeDrag.startBarF) / snapBars) * snapBars;
      const ns = Math.max(0, Math.min(seqBars - activeDrag.origLen, activeDrag.origStart + delta));
      seqLoopStart = ns; seqLoopEnd = ns + activeDrag.origLen;
      seqCacheDirty = true; statusMsg = `LOOP REGION: BARS ${(seqLoopStart + 1).toFixed(2)} - ${seqLoopEnd.toFixed(2)}`;
    } else if (activeDrag.type === "seqScrub") {
      scrubSeqToBarF(seqXToBarF(mx));
    } else if (activeDrag.type === "seqMoveSingle") {
      const cur = getSeqTrackAndTick(mx, my);
      if (cur) {
        const trk = seqTracks[activeDrag.trackIdx];
        const maxK = seqBars * TICKS_PER_BAR - snapTicks;
        const rawTarget = cur.rawTick - activeDrag.grabOffsetTicks;
        const newK = Math.max(0, Math.min(maxK, Math.round(rawTarget / snapTicks) * snapTicks));
        if (newK !== activeDrag.curK) {
          trk.cells.set(activeDrag.backup);
          if (!activeDrag.clone) trk.cells[activeDrag.origK] = 0;
          trk.cells[newK] = activeDrag.val;
          activeDrag.curK = newK;
          seqPasteAnchor = { t: activeDrag.trackIdx, k: newK };
          seqCacheDirty = true;
          statusMsg = `MOVED CLIP TO BAR ${(newK / TICKS_PER_BAR + 1).toFixed(2)}`;
        }
      }
    } else if (activeDrag.type === "seqPaintChain") {
      const cur = getSeqTrackAndTick(mx, my);
      if (cur) {
        const trk = seqTracks[activeDrag.trackIdx];
        const maxK = seqBars * TICKS_PER_BAR;
        while (cur.rawTick >= activeDrag.nextFreeK && activeDrag.nextFreeK < maxK) {
          const placeK = activeDrag.nextFreeK;
          const existing = findClipAtTick(trk, placeK);
          if (!existing) {
            trk.cells[placeK] = activeDrag.val;
            activeDrag.nextFreeK = placeK + activeDrag.clipSpan;
          } else {
            activeDrag.nextFreeK = existing.endK;
          }
          seqCacheDirty = true;
        }
      }
    } else if (activeDrag.type === "seqErase") {
      const cur = getSeqTrackAndTick(mx, my);
      if (cur) {
        const trk = seqTracks[cur.t];
        const hitClip = findClipAtTick(trk, cur.rawTick);
        if (hitClip) { trk.cells[hitClip.startK] = 0; seqCacheDirty = true; }
        else if (trk.cells[cur.k]) { trk.cells[cur.k] = 0; seqCacheDirty = true; }
      }
    } else if (activeDrag.type === "seqMarquee") {
      const cur = getSeqTrackAndTick(mx, my);
      if (cur) {
        seqSel = {
          t0: Math.min(activeDrag.anchorT, cur.t),
          t1: Math.max(activeDrag.anchorT, cur.t),
          k0: Math.min(activeDrag.anchorK, cur.k),
          k1: Math.max(activeDrag.anchorK, cur.k) + snapTicks
        };
        seqCacheDirty = true;
      }
    } else if (activeDrag.type === "seqGroupMove") {
      const cur = getSeqTrackAndTick(mx, my);
      if (cur) {
        const dt = cur.t - activeDrag.startT;
        const dk = Math.round((cur.k - activeDrag.startK) / snapTicks) * snapTicks;
        const o = activeDrag.origSel;
        const spanT = o.t1 - o.t0, spanK = o.k1 - o.k0;
        const maxK = seqBars * TICKS_PER_BAR;
        const nt0 = Math.max(0, Math.min(seqTracks.length - 1 - spanT, o.t0 + dt));
        const nk0 = Math.max(0, Math.min(maxK - spanK, o.k0 + dk));

        seqTracks.forEach((tr, idx) => tr.cells.set(activeDrag.backup[idx]));
        if (!activeDrag.clone) {
          for (let t = o.t0; t <= o.t1; t++) for (let k = o.k0; k < o.k1; k++) seqTracks[t].cells[k] = 0;
        }
        for (let t = nt0; t <= nt0 + spanT; t++) for (let k = nk0; k < nk0 + spanK; k++) seqTracks[t].cells[k] = 0;
        for (const it of activeDrag.items) {
          seqTracks[nt0 + it.dt].cells[nk0 + it.dk] = it.val;
        }
        seqSel = { t0: nt0, t1: nt0 + spanT, k0: nk0, k1: nk0 + spanK };
        seqPasteAnchor = { t: nt0, k: nk0 };
        seqCacheDirty = true;
      }
    } else if (activeDrag.type === "tscr" && treeThumbRect) {
      treeScroll = activeDrag.startScroll + ((my - activeDrag.startY) / Math.max(1, treeThumbRect.trackH - treeThumbRect.h)) * treeThumbRect.maxScroll;
    } else if ((activeDrag.type === "st" || activeDrag.type === "en") && waveRect && pad && !pad.lockSE) {
      const norm = Math.max(0, Math.min(1, viewOffset + ((mx - waveRect.x) / waveRect.w) * (1 / viewZoom)));
      if (activeDrag.type === "st") pad.st = Math.min(pad.en - 0.004, norm);
      else pad.en = Math.max(pad.st + 0.004, norm);
      pad.dirty = true; ovCacheDirty = waveCacheDirty = true;
    } else if (activeDrag.type === "stepPaint") handleStepGridInteract(mx, my, true, false);
    else if (activeDrag.type === "stepPitch") {
      const nextSemi = Math.max(-12, Math.min(12, activeDrag.startSemi + Math.round((activeDrag.startY - my) / 10)));
      if (stepPitches[activeStepPat][activeDrag.p][activeDrag.s] !== nextSemi) {
        stepPitches[activeStepPat][activeDrag.p][activeDrag.s] = nextSemi;
        statusMsg = `P${activeDrag.p + 1} STEP ${activeDrag.s + 1}: ${nextSemi > 0 ? "+" + nextSemi : nextSemi} ST`;
        if (pads[activeDrag.p].rawBuf) triggerPad(activeDrag.p, false, 0, true, Math.pow(2, nextSemi / 12));
      }
    }
    requestDraw(); return;
  }
  requestDraw();
});

window.addEventListener("mouseup", async () => {
  down = false; pressedBtnId = null; activeSlider = null;
  if (activeDrag) {
    const d = activeDrag; activeDrag = null;
    if (d.type === "treePress") auditionTreeFile(await d.item.fileFn(), d.item.name);
    else if (d.type === "treeDrag") {
      for (const z of dropZones) if (hit(z, mx, my)) { const f = await d.fileFn(); if (f) z.onDrop(f, mx, my); break; }
    }
  }
  requestDraw();
});

cv.addEventListener("wheel", e => {
  e.preventDefault();
  if (treeListRect && hit(treeListRect, e.clientX, e.clientY)) { treeScroll += e.deltaY * 0.6; requestDraw(); return; }
  if (activeTab === "edit" && waveRect && hit(waveRect, e.clientX, e.clientY) && pads[activePad].rawBuf) {
    const rel = Math.max(0, Math.min(1, (e.clientX - waveRect.x) / waveRect.w));
    setZoom(viewZoom * (e.deltaY < 0 ? 1.5 : 1 / 1.5), viewOffset + rel * (1 / viewZoom));
    return;
  }
  if (activeTab === "seq" && seqGridRect && hit(seqGridRect, e.clientX, e.clientY)) {
    const gx = seqGridRect.x + SEQ_GRID_X, gw = seqGridRect.w - SEQ_GRID_X;
    const rel = Math.max(0, Math.min(1, (e.clientX - gx) / gw));
    setSeqZoom(seqZoom * (e.deltaY < 0 ? 1.35 : 1 / 1.35), seqScroll + rel * (1 / seqZoom));
  }
}, { passive: false });

cv.ondragover = e => e.preventDefault();
cv.ondrop = e => {
  e.preventDefault();
  const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (!f) return;
  if (/\.json$/i.test(f.name)) { loadProjectFile(f); return; }
  for (const z of dropZones) if (hit(z, e.clientX, e.clientY)) { z.onDrop(f, e.clientX, e.clientY); return; }
};

window.addEventListener("keydown", e => {
  const mod = e.ctrlKey || e.metaKey;
  const key = e.key.toLowerCase();

  if (mod && key === "z") { e.preventDefault(); if (e.shiftKey) doRedo(); else doUndo(); return; }
  if (mod && key === "y") { e.preventDefault(); doRedo(); return; }
  if (mod && key === "s") { e.preventDefault(); saveProject(); return; }
  if (mod && key === "o") { e.preventDefault(); projIn.click(); return; }

  if (e.key === "Escape" && openMenu) { openMenu = null; requestDraw(); return; }

  if (activeTab === "seq") {
    if (mod && key === "x") { e.preventDefault(); cutSeqSelection(); return; }
    if (mod && key === "c") { e.preventDefault(); copySeqSelection(); return; }
    if (mod && key === "v") { e.preventDefault(); pasteSeqClipboard(); return; }
    if (mod && key === "d") { e.preventDefault(); duplicateSeqSelection(); return; }
    if (mod && key === "a") { e.preventDefault(); selectAllTimeline(); return; }
    if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); deleteSeqSelection(); return; }
    if (e.key === "Escape") { seqSel = null; seqPasteAnchor = null; seqCacheDirty = true; requestDraw(); return; }
    if (!mod && key === "s") { seqTool = seqTool === "select" ? "paint" : "select"; statusMsg = `TOOL: ${seqTool.toUpperCase()}`; requestDraw(); return; }
  }
  if (!mod && e.key >= "1" && e.key <= "8" && activeTab === "pads") { triggerPad(+e.key - 1); requestDraw(); }
  if (e.code === "Space") {
    e.preventDefault();
    if (activeTab === "pads") { if (seqRunning) stopSeq(); else if (stepRunning) stopStepPat(); else startSeq(); }
    else if (activeTab === "edit") { if (seqRunning) stopSeq(); else edPlaying ? stopEditorPlay() : startEditorPlay(); }
    else if (activeTab === "seq") seqRunning ? stopSeq() : startSeq();
    else if (activeTab === "step") stepRunning ? stopStepPat() : startStepPat();
  }
});

function onResize() {
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  buildBgCache(cv.width, cv.height);
  ovCacheDirty = waveCacheDirty = seqCacheDirty = true;
  requestDraw();
}
window.addEventListener("resize", onResize);
onResize();
})();
</script>
</body>
