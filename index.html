<script>
(() => {
const cv = document.getElementById("app");
const ctx = cv.getContext("2d");
const fIn = document.getElementById("fIn");
const projIn = document.getElementById("projIn");

// ==========================================
// 1. CONSTANTS & SP-202 DSP PROFILES
// ==========================================
const G = [
  { name: "HI-FI",    sr: 31250,   bits: 12, mu: 255, pre: .94, post: .96, hiss: .0004, makeup: 1.00 },
  { name: "STANDARD", sr: 15625,   bits: 10, mu: 128, pre: .90, post: .92, hiss: .0010, makeup: 1.15 },
  { name: "LO-FI 1",  sr: 7812.5,  bits: 8,  mu: 64,  pre: .88, post: .90, hiss: .0022, makeup: 1.32 },
  { name: "LO-FI 2",  sr: 3906.25, bits: 7,  mu: 32,  pre: .86, post: .88, hiss: .0036, makeup: 1.52 }
];
const FMODES = ["OFF", "LPF 24dB", "HPF 24dB", "BPF 24dB"];
const BEATS_OPT = [1, 2, 4, 8, 16, 32];
const BARS_OPT = [8, 16, 32, 64];

const TICKS_PER_BAR = 8;
const STEPS_PER_TICK = 2;
const MAX_SONG_BARS = 64;
const MAX_SONG_TICKS = MAX_SONG_BARS * TICKS_PER_BAR;

const SEQ_SNAPS = [
  { ticks: 8, beats: 4,   label: "1 BAR (4B)",   short: "1 BAR" },
  { ticks: 4, beats: 2,   label: "1/2 BAR (2B)", short: "2 BEATS" },
  { ticks: 2, beats: 1,   label: "1 BEAT",       short: "1 BEAT" },
  { ticks: 1, beats: 0.5, label: "1/2 BEAT",     short: "1/2 BT" }
];

const TRK_COLS = ["#00f0ff", "#ff2a85", "#00ff88", "#ffaa00", "#aa66ff", "#ff5555", "#44aaff", "#ddff33"];
const PAT_COLS = ["#00f0ff", "#ff2a85", "#00ff88", "#ffaa00", "#bb66ff", "#ff5555", "#55ccff", "#e8ff44"];
const logMap = (v, min, max) => min * Math.pow(max / min, v);

// ==========================================
// 2. APPLICATION STATE
// ==========================================
function makePad(idx) {
  return {
    idx, name: "EMPTY", rawBuf: null, bakedBuf: null, miniPeaks: null, dirty: true,
    grd: 1, sr: 15625, pt: 1, drv: 1.3, st: 0, en: 1, lockSE: false,
    loop: true, bypass: false, beats: 4, tgtBpm: 90,
    fMode: 0, fCutNorm: 0.65, fCutHz: 1900, fRes: 0.55,
    rmOn: false, rmFreqNorm: 0.45, rmFreqHz: 180, rmMix: 0.7,
    dlOn: false, dlTime: 0.28, dlAmt: 0.45,
    lastTrigTime: -1, lastTrigRate: 1,
    trigs: []
  };
}
const pads = Array.from({ length: 8 }, (_, i) => makePad(i));
let activePad = 0;
let activeTab = "pads";

const stepPats = Array.from({ length: 8 }, () => Array.from({ length: 8 }, () => new Uint8Array(16)));
const stepPitches = Array.from({ length: 8 }, () => Array.from({ length: 8 }, () => new Int8Array(16)));
let activeStepPat = 0, stepClip = null, stepPitchClip = null, stepSwing = 0;
let stepEditMode = "trig";
let stepRunning = false, stepTimer = 0, stepCur = 0, stepNextTime = 0, stepDrawCur = -1;

function makeSeqTrack(mode, padIdx) {
  return {
    mode, padIdx: padIdx || 0, vol: 0.85, mute: false,
    cells: new Uint8Array(MAX_SONG_TICKS),
    vuPeak: 0, vuLevel: 0
  };
}
let seqTracks = [
  makeSeqTrack("loop", 0), makeSeqTrack("loop", 1), makeSeqTrack("loop", 2), makeSeqTrack("loop", 3),
  makeSeqTrack("loop", 4), makeSeqTrack("loop", 5), makeSeqTrack("step", 0), makeSeqTrack("step", 0)
];
let seqBrushPat = 1, seqBpm = 90, seqBars = 16;
let seqSnapIdx = 2;
let seqTool = "paint";
let seqSel = null;
let seqClipboard = null;
let seqPasteAnchor = null;
let seqLoopOn = true, seqLoopStart = 0, seqLoopEnd = 16;
let seqZoom = 1, seqScroll = 0;
let seqRunning = false, seqTimer = 0, seqStepIdx = 0, seqNextStepTime = 0;
let seqHeadStep = 0, seqHeadTime = 0, seqScrubStep = 0;

let treeRoots = [], treeFlat = [], treeScroll = 0, treeAudName = "";
let viewZoom = 1, viewOffset = 0, edPlaying = false, readPos = 0;

let mx = 0, my = 0, down = false;
let activeSlider = null, activeDrag = null, pressedBtnId = null;
let lastClick = { t: 0, key: "" };
let statusMsg = "READY // REAL-TIME SP-202 DSP & FX ACTIVE ON ALL TRACKS";

// Dropdown Menu State
let openMenu = null; // null | "file" | "edit"
let menuBtnRects = {};
let menuItemRects = [];
let menuPanelRect = null;

// Undo / Redo History
const MAX_UNDO = 60;
const undoStack = [];
const redoStack = [];

// Offscreen Caches
const bgCv = document.createElement("canvas"), bgCtx = bgCv.getContext("2d");
const ovWfCv = document.createElement("canvas"), ovWfCtx = ovWfCv.getContext("2d");
const wfCv = document.createElement("canvas"), wfCtx = wfCv.getContext("2d");
const seqCacheCv = document.createElement("canvas"), seqCacheCtx = seqCacheCv.getContext("2d");
let waveCacheDirty = true, ovCacheDirty = true, seqCacheDirty = true;
let rafId = 0, needRedraw = true;

// Immediate-Mode UI Registry
let uiBtns = [], uiSliders = [], dropZones = [];
let waveRect = null, ovRect = null, hScrRect = null, hThumbRect = null;
let treeListRect = null, treeThumbRect = null, stepGridRect = null;
let seqGridRect = null, seqLoopRect = null, seqScrubRect = null, seqHScrRect = null, seqHThumbRect = null;

// ==========================================
// 3. UNDO / REDO ENGINE
// ==========================================
function captureState(label) {
  return {
    label,
    pads: pads.map(p => ({
      name: p.name, grd: p.grd, sr: p.sr, pt: p.pt, drv: p.drv, st: p.st, en: p.en, lockSE: p.lockSE,
      loop: p.loop, bypass: p.bypass, beats: p.beats, tgtBpm: p.tgtBpm,
      fMode: p.fMode, fCutNorm: p.fCutNorm, fCutHz: p.fCutHz, fRes: p.fRes,
      rmOn: p.rmOn, rmFreqNorm: p.rmFreqNorm, rmFreqHz: p.rmFreqHz, rmMix: p.rmMix,
      dlOn: p.dlOn, dlTime: p.dlTime, dlAmt: p.dlAmt,
      rawBuf: p.rawBuf
    })),
    stepPats: stepPats.map(pat => pat.map(r => new Uint8Array(r))),
    stepPitches: stepPitches.map(pat => pat.map(r => new Int8Array(r))),
    stepSwing,
    seqTracks: seqTracks.map(t => ({
      mode: t.mode, padIdx: t.padIdx, vol: t.vol, mute: t.mute,
      cells: new Uint8Array(t.cells)
    })),
    seqBpm, seqBars, seqLoopOn, seqLoopStart, seqLoopEnd,
    seqSel: seqSel ? { ...seqSel } : null
  };
}

function restoreState(snap) {
  snap.pads.forEach((sp, i) => {
    const p = pads[i];
    const changed = p.rawBuf !== sp.rawBuf || p.grd !== sp.grd || p.sr !== sp.sr || p.pt !== sp.pt ||
      p.drv !== sp.drv || p.st !== sp.st || p.en !== sp.en || p.bypass !== sp.bypass ||
      p.fMode !== sp.fMode || p.fCutHz !== sp.fCutHz || p.fRes !== sp.fRes ||
      p.rmOn !== sp.rmOn || p.rmFreqHz !== sp.rmFreqHz || p.rmMix !== sp.rmMix ||
      p.dlOn !== sp.dlOn || p.dlTime !== sp.dlTime || p.dlAmt !== sp.dlAmt;
    Object.assign(p, sp);
    if (changed) p.dirty = true;
    if (!p.rawBuf) { p.bakedBuf = null; p.miniPeaks = null; }
    else if (!p.miniPeaks) p.miniPeaks = computeMiniPeaks(p.rawBuf);
  });
  for (let i = 0; i < 8; i++) {
    for (let j = 0; j < 8; j++) {
      stepPats[i][j].set(snap.stepPats[i][j]);
      stepPitches[i][j].set(snap.stepPitches[i][j]);
    }
  }
  stepSwing = snap.stepSwing;

  stopAllVoices(false);
  seqTracks = snap.seqTracks.map(st => {
    const t = makeSeqTrack(st.mode, st.padIdx);
    t.vol = st.vol; t.mute = st.mute; t.cells.set(st.cells);
    return t;
  });
  seqBpm = snap.seqBpm;
  seqBars = snap.seqBars;
  seqLoopOn = snap.seqLoopOn;
  seqLoopStart = snap.seqLoopStart;
  seqLoopEnd = snap.seqLoopEnd;
  seqSel = snap.seqSel ? { ...snap.seqSel } : null;

  ovCacheDirty = waveCacheDirty = seqCacheDirty = true;
  requestDraw();
}

function pushUndo(label) {
  undoStack.push(captureState(label));
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack.length = 0;
}

function doUndo() {
  if (!undoStack.length) { statusMsg = "NOTHING TO UNDO"; requestDraw(); return; }
  const prev = undoStack.pop();
  redoStack.push(captureState(prev.label));
  restoreState(prev);
  statusMsg = `UNDO: ${prev.label}`;
  requestDraw();
}

function doRedo() {
  if (!redoStack.length) { statusMsg = "NOTHING TO REDO"; requestDraw(); return; }
  const next = redoStack.pop();
  undoStack.push(captureState(next.label));
  restoreState(next);
  statusMsg = `REDO: ${next.label}`;
  requestDraw();
}

// ==========================================
// 4. PROJECT SAVE / LOAD / NEW
// ==========================================
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onloadend = () => resolve(String(r.result).split(",")[1] || "");
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

function base64ToArrayBuffer(b64) {
  const bin = atob(b64);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

async function saveProject() {
  statusMsg = "SAVING PROJECT..."; requestDraw();
  const padData = [];
  for (let i = 0; i < 8; i++) {
    const p = pads[i];
    let audioB64 = null;
    if (p.rawBuf) {
      audioB64 = await blobToBase64(encodeWavBlob(p.rawBuf));
    }
    padData.push({
      name: p.name, grd: p.grd, sr: p.sr, pt: p.pt, drv: p.drv, st: p.st, en: p.en, lockSE: p.lockSE,
      loop: p.loop, bypass: p.bypass, beats: p.beats, tgtBpm: p.tgtBpm,
      fMode: p.fMode, fCutNorm: p.fCutNorm, fCutHz: p.fCutHz, fRes: p.fRes,
      rmOn: p.rmOn, rmFreqNorm: p.rmFreqNorm, rmFreqHz: p.rmFreqHz, rmMix: p.rmMix,
      dlOn: p.dlOn, dlTime: p.dlTime, dlAmt: p.dlAmt,
      audioB64
    });
  }
  const proj = {
    version: 1,
    seqBpm, seqBars, seqLoopOn, seqLoopStart, seqLoopEnd, stepSwing,
    pads: padData,
    stepPats: stepPats.map(pat => pat.map(r => Array.from(r))),
    stepPitches: stepPitches.map(pat => pat.map(r => Array.from(r))),
    seqTracks: seqTracks.map(t => ({
      mode: t.mode, padIdx: t.padIdx, vol: t.vol, mute: t.mute,
      cells: Array.from(t.cells)
    }))
  };
  const blob = new Blob([JSON.stringify(proj)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `SP202_PROJECT_${seqBpm}BPM.sp202.json`;
  a.click();
  statusMsg = `PROJECT SAVED (${seqBpm} BPM)`; requestDraw();
}

async function loadProjectFile(file) {
  if (!file) return;
  try {
    initAudio(); stopAllAudio();
    pushUndo("Load Project");
    const proj = JSON.parse(await file.text());
    seqBpm = proj.seqBpm || 90;
    seqBars = proj.seqBars || 16;
    seqLoopOn = proj.seqLoopOn !== undefined ? proj.seqLoopOn : true;
    seqLoopStart = proj.seqLoopStart || 0;
    seqLoopEnd = proj.seqLoopEnd || seqBars;
    stepSwing = proj.stepSwing || 0;

    if (proj.pads) {
      for (let i = 0; i < 8; i++) {
        const sp = proj.pads[i];
        const p = pads[i];
        Object.assign(p, makePad(i), sp);
        p.rawBuf = null; p.bakedBuf = null; p.miniPeaks = null; p.dirty = true;
        if (sp.audioB64) {
          p.rawBuf = await ac.decodeAudioData(base64ToArrayBuffer(sp.audioB64));
          p.miniPeaks = computeMiniPeaks(p.rawBuf);
        }
      }
    }
    if (proj.stepPats) {
      for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) stepPats[i][j].set(proj.stepPats[i][j]);
    }
    if (proj.stepPitches) {
      for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) stepPitches[i][j].set(proj.stepPitches[i][j]);
    }
    if (proj.seqTracks) {
      seqTracks = proj.seqTracks.map(st => {
        const t = makeSeqTrack(st.mode, st.padIdx);
        t.vol = st.vol; t.mute = st.mute; t.cells.set(st.cells.slice(0, MAX_SONG_TICKS));
        return t;
      });
    }
    seqSel = null; seqPasteAnchor = null;
    ovCacheDirty = waveCacheDirty = seqCacheDirty = true;
    statusMsg = `LOADED PROJECT: ${file.name}`;
    requestDraw();
  } catch (err) {
    statusMsg = "PROJECT LOAD ERROR"; requestDraw();
  }
}

function newProject() {
  stopAllAudio();
  pushUndo("New Project");
  for (let i = 0; i < 8; i++) Object.assign(pads[i], makePad(i));
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) { stepPats[i][j].fill(0); stepPitches[i][j].fill(0); }
  seqTracks = [
    makeSeqTrack("loop", 0), makeSeqTrack("loop", 1), makeSeqTrack("loop", 2), makeSeqTrack("loop", 3),
    makeSeqTrack("loop", 4), makeSeqTrack("loop", 5), makeSeqTrack("step", 0), makeSeqTrack("step", 0)
  ];
  seqBpm = 90; seqBars = 16; seqLoopOn = true; seqLoopStart = 0; seqLoopEnd = 16; stepSwing = 0;
  seqSel = null; seqPasteAnchor = null;
  ovCacheDirty = waveCacheDirty = seqCacheDirty = true;
  statusMsg = "NEW PROJECT CREATED"; requestDraw();
}

projIn.onchange = e => { if (e.target.files[0]) loadProjectFile(e.target.files[0]); projIn.value = ""; };

// ==========================================
// 5. REAL-TIME WEB AUDIO & SP-202 DSP ENGINE
// ==========================================
let ac, proc, treeAudSrc = null;
function makeChState(maxDly) {
  return {
    lp: 0, dac: 0, hold: 0, lastIdx: -1,
    l1: 0, l2: 0, l3: 0, l4: 0,
    s1L: 0, s1B: 0, s2L: 0, s2B: 0, rmPhase: 0,
    dBuf: maxDly ? new Float32Array(maxDly) : null, dIdx: 0, dLp: 0
  };
}
let chState = [makeChState(0), makeChState(0)];
let padDsp = [];
let liveVoices = [];

function resetChPair(pair, clearDelay) {
  for (let i = 0; i < 2; i++) {
    const s = pair[i];
    if (!s) continue;
    s.lp = s.dac = s.hold = s.l1 = s.l2 = s.l3 = s.l4 = s.s1L = s.s1B = s.s2L = s.s2B = s.rmPhase = 0;
    s.lastIdx = -1;
    if (clearDelay && s.dBuf) { s.dBuf.fill(0); s.dIdx = 0; s.dLp = 0; }
  }
}

function resetDspState(clearDelay) {
  resetChPair(chState, clearDelay);
}

function stopVoiceByOwner(ownerKey, when) {
  const t = when || (ac ? ac.currentTime : 0);
  for (let i = liveVoices.length - 1; i >= 0; i--) {
    const v = liveVoices[i];
    if (v.ownerKey === ownerKey) {
      if (!when) liveVoices.splice(i, 1);
      else if (v.stopTime > t) v.stopTime = t;
    }
  }
}

function stopAllVoices(clearDelay) {
  liveVoices.length = 0;
  if (clearDelay && padDsp.length) {
    for (let p = 0; p < 8; p++) resetChPair(padDsp[p], true);
  }
}

function spawnVoice(padIdx, trackIdx, ownerKey, startTime, isLoop, rate) {
  const pad = pads[padIdx];
  if (!pad || !pad.rawBuf) return null;
  initAudio();
  if (ac.state === "suspended") ac.resume();
  const t = startTime || ac.currentTime;
  if (ownerKey) stopVoiceByOwner(ownerKey, t);
  const v = {
    padIdx,
    trackIdx,
    ownerKey,
    startTime: t,
    stopTime: Infinity,
    pos: Math.floor(pad.rawBuf.length * pad.st),
    loop: !!isLoop,
    rate: rate || 1,
    started: false,
    done: false
  };
  liveVoices.push(v);
  return v;
}

function getDspCoeffs(pad, outSR) {
  const g = G[pad.grd], targetSR = pad.sr;
  const qScale = Math.min(1, Math.max(0, (targetSR - 3906.25) / (31250 - 3906.25)));
  const bits = Math.round(g.bits * 0.65 + (7 + qScale * 5) * 0.35);
  const levels = (1 << (bits - 1)) - 1;
  const mu = g.mu, logMu = Math.log(1 + mu);
  const normDrive = Math.tanh(pad.drv);
  const autoMakeup = g.makeup * (1 + (1 - qScale) * 0.18);

  const fcPre = Math.min(outSR * 0.45, Math.max(1400, targetSR * 0.48 * g.pre));
  const aPre = 1 - Math.exp(-2 * Math.PI * fcPre / outSR);
  const fcPost = Math.min(outSR * 0.45, Math.max(1500, targetSR * pad.pt * 0.56 * g.post));
  const aPost = 1 - Math.exp(-2 * Math.PI * fcPost / outSR);

  const fs2 = outSR * 2, fcClamped = Math.min(outSR * 0.42, Math.max(35, pad.fCutHz));
  const lpfG = Math.min(0.76, 1 - Math.exp(-2 * Math.PI * fcClamped / fs2));
  const lpfK = pad.fRes * 3.82, lpfComp = 1 + pad.fRes * 0.72;
  const svfF = Math.min(0.82, 2 * Math.sin(Math.PI * fcClamped / fs2));
  const svfQ = Math.max(0.14, 1.05 - pad.fRes * 0.91);
  const rmInc = (2 * Math.PI * pad.rmFreqHz) / outSR;

  const dlSamples = Math.max(1, Math.floor(pad.dlTime * outSR));
  const dlFb = pad.dlAmt * 0.78, dlWet = pad.dlAmt * 0.85;
  const dlA = 1 - Math.exp(-2 * Math.PI * 3800 / outSR);

  return { g, targetSR, bits, levels, mu, logMu, normDrive, autoMakeup, aPre, aPost, lpfG, lpfK, lpfComp, svfF, svfQ, rmInc, dlSamples, dlFb, dlWet, dlA };
}

function step202AndFx(sample, st, storedIdx, pad, c, useDelay) {
  let y = sample;
  if (!pad.bypass) {
    st.lp += c.aPre * (sample - st.lp);
    if (storedIdx !== st.lastIdx) {
      st.lastIdx = storedIdx;
      let s = (Math.tanh((st.lp + 0.015) * pad.drv) - Math.tanh(0.015 * pad.drv)) / c.normDrive;
      s += (Math.random() - Math.random()) * c.g.hiss;
      s = Math.max(-1, Math.min(1, s));
      const comp = Math.sign(s) * Math.log(1 + c.mu * Math.abs(s)) / c.logMu;
      const q = Math.round(comp * c.levels) / c.levels;
      st.hold = Math.sign(q) * (Math.pow(1 + c.mu, Math.abs(q)) - 1) / c.mu;
    }
    st.dac += c.aPost * (st.hold - st.dac);
    y = Math.tanh(st.dac * c.autoMakeup * 0.95) / 0.74;
  }
  if (pad.fMode === 1) {
    for (let k = 0; k < 2; k++) {
      const fb = Math.tanh(st.l4 * 1.35);
      const u = Math.tanh((y * c.lpfComp - c.lpfK * fb) * 1.25);
      st.l1 += c.lpfG * (u - st.l1); st.l2 += c.lpfG * (st.l1 - st.l2);
      st.l3 += c.lpfG * (st.l2 - st.l3); st.l4 += c.lpfG * (st.l3 - st.l4);
    }
    y = Math.tanh(st.l4 * 1.15);
  } else if (pad.fMode === 2) {
    let hp2 = y; const driveIn = y * (1 + pad.fRes * 0.45);
    for (let k = 0; k < 2; k++) {
      const hp1 = driveIn - st.s1L - c.svfQ * st.s1B;
      st.s1B = Math.tanh((st.s1B + c.svfF * hp1) * 1.05); st.s1L += c.svfF * st.s1B;
      hp2 = hp1 - st.s2L - c.svfQ * st.s2B;
      st.s2B = Math.tanh((st.s2B + c.svfF * hp2) * 1.05); st.s2L += c.svfF * st.s2B;
    }
    y = Math.tanh(hp2 * 0.95);
  } else if (pad.fMode === 3) {
    const driveIn = y * (1.2 + pad.fRes * 0.6);
    for (let k = 0; k < 2; k++) {
      const hp1 = driveIn - st.s1L - c.svfQ * st.s1B;
      st.s1B = Math.tanh(st.s1B + c.svfF * hp1); st.s1L += c.svfF * st.s1B;
      const hp2 = st.s1B - st.s2L - c.svfQ * st.s2B;
      st.s2B = Math.tanh(st.s2B + c.svfF * hp2); st.s2L += c.svfF * st.s2B;
    }
    y = Math.tanh(st.s2B * 1.35);
  }
  if (pad.rmOn) {
    st.rmPhase += c.rmInc;
    if (st.rmPhase > 6.2831853) st.rmPhase -= 6.2831853;
    y = y * (1 - pad.rmMix) + (y * Math.sin(st.rmPhase)) * pad.rmMix;
  }
  if (useDelay && pad.dlOn && pad.dlAmt > 0 && st.dBuf) {
    const bLen = st.dBuf.length;
    let rIdx = st.dIdx - c.dlSamples; if (rIdx < 0) rIdx += bLen;
    const delayed = st.dBuf[rIdx];
    st.dLp += c.dlA * (delayed - st.dLp);
    st.dBuf[st.dIdx] = Math.tanh(y + st.dLp * c.dlFb);
    st.dIdx = (st.dIdx + 1) % bLen;
    y = y + delayed * c.dlWet;
  }
  return Math.max(-1, Math.min(1, y));
}

function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const maxDly = Math.ceil(ac.sampleRate * 1.1);
  chState = [makeChState(maxDly), makeChState(maxDly)];
  padDsp = Array.from({ length: 8 }, () => [makeChState(maxDly), makeChState(maxDly)]);

  proc = ac.createScriptProcessor(1024, 0, 2);
  proc.onaudioprocess = e => {
    const outL = e.outputBuffer.getChannelData(0), outR = e.outputBuffer.getChannelData(1);
    const len = outL.length, outSR = ac.sampleRate;
    const blockStart = e.playbackTime || ac.currentTime;
    const invSR = 1 / outSR;
    outL.fill(0); outR.fill(0);

    // 1. Wave Editor Preview Voice (Real-Time)
    if (activeTab === "edit" && edPlaying) {
      const pad = pads[activePad];
      if (pad && pad.rawBuf) {
        const rawBuf = pad.rawBuf, inSR = rawBuf.sampleRate;
        const s0 = Math.floor(rawBuf.length * pad.st), s1 = Math.max(s0 + 2, Math.floor(rawBuf.length * pad.en));
        const inL = rawBuf.getChannelData(0), inR = rawBuf.numberOfChannels > 1 ? rawBuf.getChannelData(1) : inL;
        const step = pad.pt * (inSR / outSR), srRatio = pad.sr / inSR;
        const c = getDspCoeffs(pad, outSR);
        for (let i = 0; i < len; i++) {
          let xL = 0, xR = 0, storedIdx = -1;
          if (edPlaying) {
            if (readPos < s0) readPos = s0;
            if (readPos >= s1) {
              if (pad.loop) { readPos = s0; resetDspState(false); }
              else edPlaying = false;
            }
            if (edPlaying) {
              const i0 = Math.floor(readPos), frac = readPos - i0, i1 = Math.min(s1 - 1, i0 + 1);
              xL = inL[i0] + (inL[i1] - inL[i0]) * frac;
              xR = inR[i0] + (inR[i1] - inR[i0]) * frac;
              storedIdx = Math.floor(readPos * srRatio);
              readPos += step;
            }
          }
          if (edPlaying || (pad.dlOn && pad.dlAmt > 0)) {
            outL[i] += step202AndFx(xL, chState[0], storedIdx, pad, c, true);
            outR[i] += step202AndFx(xR, chState[1], storedIdx, pad, c, true);
          }
        }
      }
    }

    // 2. Real-Time Multi-Voice Engine (Song Timeline, Step Sequencer, Pad Matrix)
    if (liveVoices.length || pads.some(p => p.dlOn && p.dlAmt > 0)) {
      const trkPeaks = new Float32Array(seqTracks.length);

      for (let p = 0; p < 8; p++) {
        const pad = pads[p];
        if (!pad.rawBuf) continue;

        // Collect voices belonging to this pad
        let pVoices = null;
        for (let vi = 0; vi < liveVoices.length; vi++) {
          if (liveVoices[vi].padIdx === p && !liveVoices[vi].done) {
            if (!pVoices) pVoices = [];
            pVoices.push(liveVoices[vi]);
          }
        }
        const hasDelay = pad.dlOn && pad.dlAmt > 0;
        if (!pVoices && !hasDelay) continue;

        const rawBuf = pad.rawBuf, inSR = rawBuf.sampleRate;
        const s0 = Math.floor(rawBuf.length * pad.st), s1 = Math.max(s0 + 2, Math.floor(rawBuf.length * pad.en));
        const inL = rawBuf.getChannelData(0), inR = rawBuf.numberOfChannels > 1 ? rawBuf.getChannelData(1) : inL;
        const srRatio = pad.sr / inSR;
        const c = getDspCoeffs(pad, outSR);
        const dspL = padDsp[p][0], dspR = padDsp[p][1];

        for (let i = 0; i < len; i++) {
          const t = blockStart + i * invSR;
          let xL = 0, xR = 0, storedIdx = -1;
          let gain = 1, activeTrk = -1, anyActive = false;

          if (pVoices) {
            for (let vi = 0; vi < pVoices.length; vi++) {
              const v = pVoices[vi];
              if (v.done) continue;
              if (t >= v.stopTime) { v.done = true; continue; }
              if (t < v.startTime) continue;

              if (!v.started) {
                v.started = true;
                v.pos = s0;
                resetChPair(padDsp[p], false);
              }
              if (v.pos < s0) v.pos = s0;
              if (v.pos >= s1) {
                if (v.loop) { v.pos = s0; resetChPair(padDsp[p], false); }
                else { v.done = true; continue; }
              }

              const i0 = Math.floor(v.pos), frac = v.pos - i0, i1 = Math.min(s1 - 1, i0 + 1);
              xL += inL[i0] + (inL[i1] - inL[i0]) * frac;
              xR += inR[i0] + (inR[i1] - inR[i0]) * frac;
              storedIdx = Math.floor(v.pos * srRatio);
              v.pos += pad.pt * v.rate * (inSR / outSR);
              anyActive = true;

              if (v.trackIdx >= 0 && v.trackIdx < seqTracks.length) {
                const trk = seqTracks[v.trackIdx];
                gain = trk.mute ? 0 : trk.vol;
                activeTrk = v.trackIdx;
              } else {
                gain = 1;
                activeTrk = -1;
              }
            }
          }

          if (anyActive || hasDelay) {
            const yL = step202AndFx(xL, dspL, storedIdx, pad, c, true) * gain;
            const yR = step202AndFx(xR, dspR, storedIdx, pad, c, true) * gain;
            outL[i] += yL;
            outR[i] += yR;
            if (activeTrk >= 0) {
              const pk = Math.max(Math.abs(yL), Math.abs(yR));
              if (pk > trkPeaks[activeTrk]) trkPeaks[activeTrk] = pk;
            }
          }
        }
      }

      // Update per-track VU peaks & prune finished voices
      for (let t = 0; t < seqTracks.length; t++) seqTracks[t].vuPeak = trkPeaks[t];
      let w = 0;
      for (let i = 0; i < liveVoices.length; i++) {
        if (!liveVoices[i].done) liveVoices[w++] = liveVoices[i];
      }
      liveVoices.length = w;
    }

    // Master soft-clip
    for (let i = 0; i < len; i++) {
      outL[i] = Math.tanh(outL[i]);
      outR[i] = Math.tanh(outR[i]);
    }
  };
  proc.connect(ac.destination);
}

function computeMiniPeaks(buf) {
  const bins = 256, peaks = new Float32Array(bins), d = buf.getChannelData(0);
  const spp = d.length / bins, stride = Math.max(1, Math.floor(spp / 24));
  for (let b = 0; b < bins; b++) {
    const s = Math.floor(b * spp), e = Math.min(d.length, Math.max(s + 1, Math.floor((b + 1) * spp)));
    let mx = 0;
    for (let i = s; i < e; i += stride) { const v = Math.abs(d[i]); if (v > mx) mx = v; }
    peaks[b] = mx;
  }
  return peaks;
}

function ensurePadBuffer(pad, includeDelayTail) {
  if (!pad.rawBuf) return null;
  initAudio();
  if (!pad.dirty && pad.bakedBuf && !includeDelayTail) return pad.bakedBuf;
  const rawBuf = pad.rawBuf, inSR = rawBuf.sampleRate, outSR = ac.sampleRate, nc = rawBuf.numberOfChannels;
  const s0 = Math.floor(rawBuf.length * pad.st), s1 = Math.max(s0 + 2, Math.floor(rawBuf.length * pad.en));
  const step = pad.pt * (inSR / outSR), dryLen = Math.max(1, Math.floor((s1 - s0) / step));
  const tailSec = (includeDelayTail && pad.dlOn && pad.dlAmt > 0) ? Math.min(2.5, pad.dlTime * (1.5 + pad.dlAmt * 3)) : 0;
  const outLen = dryLen + Math.floor(tailSec * outSR), srRatio = pad.sr / inSR;
  const c = getDspCoeffs(pad, outSR);
  const buf = ac.createBuffer(nc, outLen, outSR);
  const chIn = Array.from({ length: nc }, (_, ch) => rawBuf.getChannelData(ch));
  const chOut = Array.from({ length: nc }, (_, ch) => buf.getChannelData(ch));
  const stExp = Array.from({ length: nc }, () => makeChState(Math.ceil(outSR * 1.1)));

  let pos = s0;
  for (let i = 0; i < outLen; i++) {
    const inR = i < dryLen;
    const i0 = inR ? Math.min(s1 - 1, Math.floor(pos)) : 0, i1 = inR ? Math.min(s1 - 1, i0 + 1) : 0;
    const frac = inR ? pos - i0 : 0, storedIdx = inR ? Math.floor(pos * srRatio) : -1;
    for (let ch = 0; ch < nc; ch++) {
      const x = inR ? chIn[ch][i0] + (chIn[ch][i1] - chIn[ch][i0]) * frac : 0;
      chOut[ch][i] = step202AndFx(x, stExp[ch], storedIdx, pad, c, true);
    }
    if (inR) pos += step;
  }
  if (!includeDelayTail) { pad.bakedBuf = buf; pad.miniPeaks = computeMiniPeaks(buf); pad.dirty = false; }
  return buf;
}

const getPadOrigBpm = pad => pad.rawBuf ? (pad.beats * 60) / Math.max(0.01, pad.rawBuf.duration * (pad.en - pad.st)) : 0;
const getPadOutDur = pad => pad.rawBuf ? (pad.rawBuf.duration * (pad.en - pad.st)) / pad.pt : 0;

function getClipSpanTicks(trk) {
  if (trk.mode === "step") return TICKS_PER_BAR;
  const dur = getPadOutDur(pads[trk.padIdx]);
  const barDur = 240 / seqBpm;
  if (dur <= 0) return SEQ_SNAPS[seqSnapIdx].ticks;
  return Math.max(1, Math.ceil((dur / barDur) * TICKS_PER_BAR - 0.02));
}

function findClipAtTick(trk, targetK) {
  const maxK = seqBars * TICKS_PER_BAR;
  const naturalTicks = getClipSpanTicks(trk);
  for (let k = Math.min(targetK, maxK - 1); k >= 0; k--) {
    if (trk.cells[k]) {
      let nextK = maxK;
      for (let nk = k + 1; nk < maxK; nk++) {
        if (trk.cells[nk]) { nextK = nk; break; }
      }
      const endK = Math.min(nextK, k + naturalTicks);
      if (targetK >= k && targetK < endK) {
        return { startK: k, endK, spanTicks: Math.max(1, endK - k), val: trk.cells[k] };
      }
      break;
    }
  }
  return null;
}

function fitPadToBpm(pad, targetBpm) {
  if (!pad.rawBuf) return;
  const orig = getPadOrigBpm(pad); if (orig <= 0) return;
  pad.tgtBpm = Math.max(20, Math.min(300, Math.round(targetBpm)));
  pad.pt = Math.max(0.25, Math.min(2.5, pad.tgtBpm / orig));
  pad.dirty = true;
}
function stepPadSemitone(pad, deltaSt) {
  pushUndo("Pitch Step");
  const curSt = Math.round(12 * Math.log2(pad.pt));
  const nextSt = Math.max(-24, Math.min(16, curSt + deltaSt));
  pad.pt = Math.max(0.25, Math.min(2.5, Math.pow(2, nextSt / 12)));
  const orig = getPadOrigBpm(pad); if (orig) pad.tgtBpm = Math.round(orig * pad.pt);
  pad.dirty = true; waveCacheDirty = seqCacheDirty = true;
}

function encodeWavBlob(audioBuf) {
  const nc = audioBuf.numberOfChannels, len = audioBuf.length, sr = audioBuf.sampleRate;
  const ab = new ArrayBuffer(44 + len * nc * 2), v = new DataView(ab);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, "RIFF"); v.setUint32(4, 36 + len * nc * 2, true); ws(8, "WAVE");
  ws(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, nc, true); v.setUint32(24, sr, true);
  v.setUint32(28, sr * nc * 2, true); v.setUint16(32, nc * 2, true); v.setUint16(34, 16, true);
  ws(36, "data"); v.setUint32(40, len * nc * 2, true);
  const chs = Array.from({ length: nc }, (_, c) => audioBuf.getChannelData(c));
  let p = 44;
  for (let i = 0; i < len; i++) {
    for (let c = 0; c < nc; c++) {
      const y = Math.max(-1, Math.min(1, chs[c][i]));
      v.setInt16(p, y < 0 ? y * 32768 : y * 32767, true);
      p += 2;
    }
  }
  return new Blob([ab], { type: "audio/wav" });
}

function exportActivePadWav() {
  const pad = pads[activePad];
  if (!pad || !pad.rawBuf) { statusMsg = "ACTIVE PAD IS EMPTY"; requestDraw(); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(encodeWavBlob(ensurePadBuffer(pad, true)));
  a.download = `${pad.name}_SP202_${G[pad.grd].name}_${pad.sr}Hz.wav`;
  a.click();
  statusMsg = `EXPORTED PAD ${activePad + 1} WAV`; requestDraw();
}

// ==========================================
// 6. HARDWARE-SYNCED PAD LED TRACKING & TRANSPORT
// ==========================================
function registerPadLed(pad, startTime, dur, isLoop, monoCut) {
  const d = Math.max(0.05, dur);
  if (monoCut) {
    for (let i = 0; i < pad.trigs.length; i++) {
      if (pad.trigs[i].end > startTime) pad.trigs[i].end = startTime;
    }
  }
  pad.trigs.push({ start: startTime, end: isLoop ? Infinity : startTime + d, loop: isLoop, dur: d });
  if (pad.trigs.length > 16) pad.trigs.shift();
  ensureAnim();
}

function clearPadLeds(pad) { pad.trigs.length = 0; }

function getPadLedState(pad) {
  if (!ac || !pad.trigs.length) return { lit: false, prog: 0 };
  const now = ac.currentTime;
  let w = 0;
  for (let i = 0; i < pad.trigs.length; i++) if (pad.trigs[i].end > now) pad.trigs[w++] = pad.trigs[i];
  pad.trigs.length = w;
  for (let i = pad.trigs.length - 1; i >= 0; i--) {
    const tr = pad.trigs[i];
    if (tr.start <= now && now < tr.end) {
      const elapsed = now - tr.start;
      return { lit: true, prog: tr.loop ? ((elapsed % tr.dur) / tr.dur) : Math.min(1, elapsed / tr.dur) };
    }
  }
  return { lit: false, prog: 0 };
}

function stopTreeAudition() { if (treeAudSrc) { try { treeAudSrc.stop(); } catch {} treeAudSrc = null; treeAudName = ""; } }
async function auditionTreeFile(f, name) {
  if (!f) return;
  initAudio(); if (ac.state === "suspended") ac.resume();
  stopTreeAudition();
  try {
    const buf = await ac.decodeAudioData(await f.arrayBuffer());
    const src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination); src.start();
    treeAudSrc = src; treeAudName = name; statusMsg = `AUDITIONING: ${name}`;
    src.onended = () => { if (treeAudSrc === src) { treeAudSrc = null; treeAudName = ""; requestDraw(); } };
    requestDraw();
  } catch { statusMsg = "DECODE ERROR"; requestDraw(); }
}

function stopPadNode(pad, when) {
  stopVoiceByOwner(`pad_${pad.idx}`, when);
  if (!when) clearPadLeds(pad);
}

function triggerPad(idx, isScheduled, when, oneShotOverride, rate = 1) {
  const pad = pads[idx];
  if (!isScheduled) activePad = idx;
  if (!pad.rawBuf) return null;
  initAudio(); if (ac.state === "suspended") ac.resume();
  const t = when || ac.currentTime;
  const isLoop = oneShotOverride ? false : pad.loop;
  const v = spawnVoice(idx, -1, `pad_${idx}`, t, isLoop, rate);
  pad.lastTrigTime = t; pad.lastTrigRate = rate;
  registerPadLed(pad, t, getPadOutDur(pad) / rate, isLoop, true);
  return v;
}

function startEditorPlay(fromNorm) {
  const pad = pads[activePad]; if (!pad || !pad.rawBuf) return;
  initAudio(); if (ac.state === "suspended") ac.resume();
  stopSeq(); stopStepPat();
  const s0 = Math.floor(pad.rawBuf.length * pad.st), s1 = Math.floor(pad.rawBuf.length * pad.en);
  readPos = fromNorm !== undefined ? Math.max(s0, Math.min(s1 - 1, Math.floor(fromNorm * pad.rawBuf.length))) : s0;
  resetDspState(false); edPlaying = true; ensureAnim();
}
function stopEditorPlay() {
  edPlaying = false; resetDspState(true);
  const pad = pads[activePad];
  if (pad && pad.rawBuf) readPos = Math.floor(pad.rawBuf.length * pad.st);
  requestDraw();
}

function getSeqPlayheadBarF() {
  if (!seqRunning || !ac) return seqScrubStep / 16;
  const stepDur = 60 / seqBpm / 4;
  let raw = seqHeadStep + (ac.currentTime - seqHeadTime) / stepDur;
  const ls = seqLoopOn ? Math.round(seqLoopStart * 16) : 0;
  const le = seqLoopOn ? Math.round(seqLoopEnd * 16) : seqBars * 16;
  const len = Math.max(2, le - ls);
  if (seqLoopOn) {
    if (raw >= le) raw = ls + ((raw - ls) % len);
    else if (raw < ls) raw = ls;
  } else {
    raw = Math.min(seqBars * 16, Math.max(0, raw));
  }
  return raw / 16;
}

function setSeqBpm(newBpm) {
  if (seqRunning && ac) {
    seqHeadStep = getSeqPlayheadBarF() * 16;
    seqHeadTime = ac.currentTime;
  }
  seqBpm = Math.max(30, Math.min(240, newBpm));
  seqCacheDirty = true;
}

function setSeqBars(newBars) {
  pushUndo("Change Song Bars");
  const wasFull = (seqLoopStart === 0 && seqLoopEnd === seqBars);
  seqBars = newBars;
  if (wasFull) { seqLoopStart = 0; seqLoopEnd = seqBars; }
  else {
    seqLoopEnd = Math.min(seqBars, Math.max(0.25, seqLoopEnd));
    seqLoopStart = Math.min(seqLoopEnd - 0.125, Math.max(0, seqLoopStart));
  }
  seqScrubStep = Math.min(seqBars * 16 - 1, seqScrubStep);
  clampSeqView();
  seqCacheDirty = true;
}

function scrubSeqToBarF(barF) {
  const snapTicks = SEQ_SNAPS[seqSnapIdx].ticks;
  const snapSteps = snapTicks * STEPS_PER_TICK;
  const maxStep = seqBars * 16 - 1;
  const snappedStep = Math.round((barF * 16) / snapSteps) * snapSteps;
  const targetStep = Math.max(0, Math.min(maxStep, snappedStep));
  seqScrubStep = targetStep;
  if (seqRunning && ac) {
    stopAllVoices(false);
    pads.forEach(clearPadLeds);
    seqStepIdx = targetStep;
    seqNextStepTime = ac.currentTime + 0.02;
    seqHeadStep = targetStep;
    seqHeadTime = seqNextStepTime;
  }
  requestDraw();
}

// ==========================================
// 7. MARQUEE SELECTION & CLIPBOARD (CTRL+X / C / V / D / A / DEL)
// ==========================================
function selectAllTimeline() {
  seqSel = { t0: 0, t1: seqTracks.length - 1, k0: 0, k1: seqBars * TICKS_PER_BAR };
  seqCacheDirty = true;
  statusMsg = `SELECTED ALL (${seqBars} BARS × ${seqTracks.length} TRACKS)`;
  requestDraw();
}

function copySeqSelection() {
  if (!seqSel) { statusMsg = "NOTHING SELECTED // SHIFT+DRAG OR USE [SELECT] BOX FIRST"; requestDraw(); return; }
  const { t0, t1, k0, k1 } = seqSel;
  const items = [];
  for (let t = t0; t <= t1; t++) {
    const trk = seqTracks[t];
    if (!trk) continue;
    for (let k = k0; k < k1; k++) {
      if (trk.cells[k]) items.push({ dt: t - t0, dk: k - k0, val: trk.cells[k] });
    }
  }
  seqClipboard = {
    spanTracks: t1 - t0 + 1,
    spanTicks: Math.max(1, k1 - k0),
    items
  };
  statusMsg = `COPIED ${items.length} CLIP(S) (${(seqClipboard.spanTicks / TICKS_PER_BAR).toFixed(2)} BARS × ${seqClipboard.spanTracks} TRK)`;
  requestDraw();
}

function cutSeqSelection() {
  if (!seqSel) { statusMsg = "NOTHING SELECTED TO CUT"; requestDraw(); return; }
  copySeqSelection();
  pushUndo("Cut Selection");
  const { t0, t1, k0, k1 } = seqSel;
  for (let t = t0; t <= t1; t++) {
    if (!seqTracks[t]) continue;
    for (let k = k0; k < k1; k++) seqTracks[t].cells[k] = 0;
  }
  seqCacheDirty = true;
  statusMsg = `CUT ${seqClipboard ? seqClipboard.items.length : 0} CLIP(S) TO CLIPBOARD`;
  requestDraw();
}

function pasteSeqClipboard(atTickOverride, atTrackOverride) {
  if (!seqClipboard) { statusMsg = "CLIPBOARD EMPTY // SELECT CLIPS & PRESS CTRL+C FIRST"; requestDraw(); return; }
  pushUndo("Paste Clips");
  const snapTicks = SEQ_SNAPS[seqSnapIdx].ticks;
  const playTick = Math.floor((Math.round(getSeqPlayheadBarF() * TICKS_PER_BAR)) / snapTicks) * snapTicks;
  const baseK = atTickOverride !== undefined ? atTickOverride : (seqPasteAnchor ? seqPasteAnchor.k : playTick);
  const baseT = atTrackOverride !== undefined ? atTrackOverride : (seqPasteAnchor ? seqPasteAnchor.t : (seqSel ? seqSel.t0 : 0));
  const maxK = seqBars * TICKS_PER_BAR;

  const endT = Math.min(seqTracks.length - 1, baseT + seqClipboard.spanTracks - 1);
  const endK = Math.min(maxK, baseK + seqClipboard.spanTicks);

  for (let t = baseT; t <= endT; t++) {
    for (let k = baseK; k < endK; k++) seqTracks[t].cells[k] = 0;
  }
  let pasted = 0;
  for (const it of seqClipboard.items) {
    const t = baseT + it.dt, k = baseK + it.dk;
    if (t >= 0 && t < seqTracks.length && k >= 0 && k < maxK) {
      seqTracks[t].cells[k] = it.val;
      pasted++;
    }
  }
  seqSel = { t0: baseT, t1: endT, k0: baseK, k1: endK };
  const nextK = Math.min(maxK - snapTicks, endK);
  seqPasteAnchor = { t: baseT, k: nextK };
  seqScrubStep = nextK * STEPS_PER_TICK;
  seqCacheDirty = true;
  statusMsg = `PASTED ${pasted} CLIP(S) AT BAR ${(baseK / TICKS_PER_BAR + 1).toFixed(2)} (PRESS CTRL+V AGAIN TO CHAIN)`;
  requestDraw();
}

function duplicateSeqSelection() {
  if (!seqSel) return;
  copySeqSelection();
  pasteSeqClipboard(seqSel.k1, seqSel.t0);
}

function deleteSeqSelection() {
  if (!seqSel) return;
  pushUndo("Delete Selection");
  const { t0, t1, k0, k1 } = seqSel;
  for (let t = t0; t <= t1; t++) {
    if (!seqTracks[t]) continue;
    for (let k = k0; k < k1; k++) seqTracks[t].cells[k] = 0;
  }
  seqCacheDirty = true;
  statusMsg = "DELETED SELECTED / GROUPED WAVES";
  requestDraw();
}

function clearSelectionOrSong() {
  if (seqSel) {
    deleteSeqSelection();
  } else {
    pushUndo("Clear Entire Song");
    seqTracks.forEach(t => t.cells.fill(0));
    seqSel = null;
    seqCacheDirty = true;
    statusMsg = "CLEARED ENTIRE SONG TIMELINE (CTRL+Z TO UNDO)";
    requestDraw();
  }
}

function scheduleTimelineStep(globalStep, time, loopStartStep) {
  const tickIdx = Math.floor(globalStep / STEPS_PER_TICK);
  const subStep = globalStep % STEPS_PER_TICK;
  const minTick = Math.floor(loopStartStep / STEPS_PER_TICK);
  const stepDur = 60 / seqBpm / 4, swOffset = (globalStep % 2 === 1) ? stepSwing * stepDur * 0.33 : 0;

  for (let t = 0; t < seqTracks.length; t++) {
    const trk = seqTracks[t];
    if (trk.mode === "loop") {
      if (subStep === 0 && trk.cells[tickIdx]) {
        const pad = pads[trk.padIdx]; if (!pad.rawBuf) continue;
        spawnVoice(trk.padIdx, t, `trk_${t}`, time, false, 1);
        pad.lastTrigTime = time; pad.lastTrigRate = 1;
        if (!trk.mute) registerPadLed(pad, time, getPadOutDur(pad), false, true);
      }
    } else {
      let pNum = 0, patStep = 0;
      for (let d = 0; d < TICKS_PER_BAR; d++) {
        const k = tickIdx - d;
        if (k < minTick) break;
        if (trk.cells[k]) { pNum = trk.cells[k]; patStep = d * STEPS_PER_TICK + subStep; break; }
      }
      if (!pNum) continue;
      const pat = stepPats[pNum - 1], pitches = stepPitches[pNum - 1], trigTime = time + swOffset;
      for (let p = 0; p < 8; p++) {
        if (pat[p][patStep]) {
          const pad = pads[p]; if (!pad.rawBuf) continue;
          const rate = Math.pow(2, pitches[p][patStep] / 12);
          spawnVoice(p, t, `trk_${t}_p${p}`, trigTime, false, rate);
          pad.lastTrigTime = trigTime; pad.lastTrigRate = rate;
          if (!trk.mute) registerPadLed(pad, trigTime, getPadOutDur(pad) / rate, false, true);
        }
      }
    }
  }
}

function seqScheduler() {
  if (!seqRunning) return;
  const stepDur = 60 / seqBpm / 4;
  const ls = seqLoopOn ? Math.round(seqLoopStart * 16) : 0;
  const le = seqLoopOn ? Math.round(seqLoopEnd * 16) : seqBars * 16;
  while (seqNextStepTime < ac.currentTime + 0.1) {
    if (seqStepIdx >= le) {
      if (seqLoopOn) {
        seqStepIdx = ls;
        seqHeadStep = ls;
        seqHeadTime = seqNextStepTime;
      } else {
        stopSeq(); return;
      }
    }
    scheduleTimelineStep(seqStepIdx, seqNextStepTime, ls);
    seqNextStepTime += stepDur;
    seqStepIdx++;
  }
}

function startSeq() {
  initAudio(); if (ac.state === "suspended") ac.resume();
  stopEditorPlay(); stopStepPat(); stopSeq();
  pads.forEach(p => { p.lastTrigTime = -1; clearPadLeds(p); });
  const ls = seqLoopOn ? Math.round(seqLoopStart * 16) : 0;
  const le = seqLoopOn ? Math.round(seqLoopEnd * 16) : seqBars * 16;
  const startStep = (seqScrubStep >= ls && seqScrubStep < le) ? seqScrubStep : ls;
  seqRunning = true;
  seqStepIdx = startStep;
  seqNextStepTime = ac.currentTime + 0.04;
  seqHeadStep = startStep;
  seqHeadTime = seqNextStepTime;
  seqTimer = setInterval(seqScheduler, 25);
  ensureAnim();
}

function stopSeq() {
  seqRunning = false; clearInterval(seqTimer);
  stopAllVoices(true);
  seqTracks.forEach(trk => { trk.vuPeak = 0; trk.vuLevel = 0; });
  pads.forEach(p => { p.lastTrigTime = -1; clearPadLeds(p); });
  requestDraw();
}

function stepScheduler() {
  if (!stepRunning) return;
  const stepDur = 60 / seqBpm / 4;
  while (stepNextTime < ac.currentTime + 0.1) {
    const s = stepCur, sw = (s % 2 === 1) ? stepSwing * stepDur * 0.33 : 0, t = stepNextTime + sw;
    const pat = stepPats[activeStepPat], pitches = stepPitches[activeStepPat];
    for (let p = 0; p < 8; p++) if (pat[p][s] && pads[p].rawBuf) triggerPad(p, true, t, true, Math.pow(2, pitches[p][s] / 12));
    const delay = Math.max(0, (t - ac.currentTime) * 1000);
    setTimeout(() => { if (stepRunning && activeTab === "step") { stepDrawCur = s; requestDraw(); } }, delay);
    stepNextTime += stepDur; stepCur = (stepCur + 1) % 16;
  }
}
function startStepPat() {
  initAudio(); if (ac.state === "suspended") ac.resume();
  stopSeq(); stopEditorPlay(); stopStepPat();
  pads.forEach(p => { p.lastTrigTime = -1; clearPadLeds(p); });
  stepRunning = true; stepCur = 0; stepNextTime = ac.currentTime + 0.04;
  stepTimer = setInterval(stepScheduler, 25); ensureAnim();
}
function stopStepPat() { stepRunning = false; clearInterval(stepTimer); stepDrawCur = -1; stopAllVoices(true); pads.forEach(clearPadLeds); requestDraw(); }
function stopAllAudio() {
  stopTreeAudition(); stopEditorPlay(); stopSeq(); stopStepPat();
  stopAllVoices(true);
  pads.forEach(p => { p.lastTrigTime = -1; clearPadLeds(p); });
  requestDraw();
}

async function loadFileToPad(idx, f, autoPlay) {

  pad.miniPeaks = computeMiniPeaks(pad.rawBuf);

}

function exportTimelineWav() {
  initAudio();
  const sr = ac.sampleRate, barDur = 240 / seqBpm, tickDur = barDur / TICKS_PER_BAR, stepDur = barDur / 16;
  const kStart = seqLoopOn ? Math.round(seqLoopStart * TICKS_PER_BAR) : 0;
  const kEnd = seqLoopOn ? Math.round(seqLoopEnd * TICKS_PER_BAR) : seqBars * TICKS_PER_BAR;
  const spanTicks = Math.max(1, kEnd - kStart);
  const totalLen = Math.ceil(spanTicks * tickDur * sr);
  const mixBuf = ac.createBuffer(2, totalLen, sr);
  const outL = mixBuf.getChannelData(0), outR = mixBuf.getChannelData(1);
  pads.forEach(p => { if (p.rawBuf) ensurePadBuffer(p, false); });

  for (let t = 0; t < seqTracks.length; t++) {
    const trk = seqTracks[t]; if (trk.mute) continue;
    if (trk.mode === "loop") {
      const pad = pads[trk.padIdx]; if (!pad.bakedBuf) continue;
      const pL = pad.bakedBuf.getChannelData(0), pR = pad.bakedBuf.numberOfChannels > 1 ? pad.bakedBuf.getChannelData(1) : pL;
      for (let k = kStart; k < kEnd; k++) {
        if (!trk.cells[k]) continue;
        const s0 = Math.floor((k - kStart) * tickDur * sr);
        let s1 = Math.min(totalLen, s0 + pad.bakedBuf.length);
        for (let nk = k + 1; nk < kEnd; nk++) if (trk.cells[nk]) { s1 = Math.min(s1, Math.floor((nk - kStart) * tickDur * sr)); break; }
        for (let i = s0; i < s1; i++) { outL[i] += pL[i - s0] * trk.vol; outR[i] += pR[i - s0] * trk.vol; }
      }
    } else {
      const padTrigs = Array.from({ length: 8 }, () => []);
      for (let gs = kStart * STEPS_PER_TICK; gs < kEnd * STEPS_PER_TICK; gs++) {
        const tickIdx = Math.floor(gs / STEPS_PER_TICK), subStep = gs % STEPS_PER_TICK;
        let pNum = 0, patStep = 0;
        for (let d = 0; d < TICKS_PER_BAR; d++) {
          const k = tickIdx - d;
          if (k < kStart) break;
          if (trk.cells[k]) { pNum = trk.cells[k]; patStep = d * STEPS_PER_TICK + subStep; break; }
        }
        if (!pNum) continue;
        const pat = stepPats[pNum - 1], pitches = stepPitches[pNum - 1];
        const sw = (gs % 2 === 1) ? stepSwing * stepDur * 0.33 : 0;
        const s0 = Math.floor(((gs - kStart * STEPS_PER_TICK) * stepDur + sw) * sr);
        for (let p = 0; p < 8; p++) if (pat[p][patStep] && pads[p].bakedBuf) padTrigs[p].push({ s0, rate: Math.pow(2, pitches[p][patStep] / 12) });
      }
      for (let p = 0; p < 8; p++) {
        const list = padTrigs[p]; if (!list.length) continue;
        const pBuf = pads[p].bakedBuf, pL = pBuf.getChannelData(0), pR = pBuf.numberOfChannels > 1 ? pBuf.getChannelData(1) : pL;
        for (let idx = 0; idx < list.length; idx++) {
          const { s0, rate } = list[idx], nextS = idx + 1 < list.length ? list[idx + 1].s0 : totalLen;
          const s1 = Math.min(totalLen, nextS, s0 + Math.floor(pBuf.length / rate));
          for (let i = s0; i < s1; i++) {
            const fp = (i - s0) * rate, i0 = Math.floor(fp), frac = fp - i0, i1 = Math.min(pBuf.length - 1, i0 + 1);
            outL[i] += (pL[i0] + (pL[i1] - pL[i0]) * frac) * trk.vol;
            outR[i] += (pR[i0] + (pR[i1] - pR[i0]) * frac) * trk.vol;
          }
        }
      }
    }
  }
  for (let i = 0; i < totalLen; i++) { outL[i] = Math.tanh(outL[i]); outR[i] = Math.tanh(outR[i]); }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(encodeWavBlob(mixBuf));
  a.download = `SP202_SONG_${seqBpm}BPM.wav`; a.click();
  statusMsg = `EXPORTED SONG WAV (${seqBpm} BPM)`; requestDraw();
}

function rebuildTreeFlat() {
  treeFlat = [];
  const walk = (nodes, depth) => {
    for (const n of nodes) {
      n.depth = depth; treeFlat.push(n);
      if (n.type === "dir" && n.open && n.children) walk(n.children, depth + 1);
    }
  };
  walk(treeRoots, 0); requestDraw();
}
async function readDirNodes(handle) {
  const dirs = [], files = [];
  for await (const entry of handle.values()) {
    if (entry.kind === "directory") dirs.push({ type: "dir", name: entry.name, handle: entry, open: false, loaded: false, children: [] });
    else if (/\.(wav|mp3|ogg|flac|m4a)$/i.test(entry.name)) files.push({ type: "file", name: entry.name, fileFn: () => entry.getFile() });
  }
  dirs.sort((a, b) => a.name.localeCompare(b.name)); files.sort((a, b) => a.name.localeCompare(b.name));
  return [...dirs, ...files];
}
async function openSampleFolder() {
  try {
    const h = await window.showDirectoryPicker();
    treeRoots = await readDirNodes(h); treeScroll = 0; rebuildTreeFlat();
    statusMsg = `FOLDER LOADED (${treeRoots.length} ITEMS)`; requestDraw();
  } catch {}
}
fIn.onchange = e => {
  treeRoots = Array.from(e.target.files).map(f => ({ type: "file", name: f.name, fileFn: async () => f }));
  treeScroll = 0; rebuildTreeFlat(); statusMsg = `LOADED ${treeRoots.length} FILE(S)`; requestDraw();
};

function rrect(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
  g.closePath();
}

function buildBgCache(w, h) {
  bgCv.width = w; bgCv.height = h;
  const g = bgCtx;
  const base = g.createLinearGradient(0, 0, w, h);
  base.addColorStop(0, "#050912"); base.addColorStop(0.5, "#0a1324"); base.addColorStop(1, "#04070e");
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  const orbs = [
    [w * 0.16, h * 0.22, Math.max(w, h) * 0.34, "rgba(0, 210, 255, 0.13)"],
    [w * 0.82, h * 0.20, Math.max(w, h) * 0.30, "rgba(255, 42, 133, 0.10)"],

  for (const [ox, oy, rad, col] of orbs) {

    rg.addColorStop(0, col); rg.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = rg; g.fillRect(0, 0, w, h);
  }
}

function drawGlassPanel(x, y, w, h, title, accent, glowAlpha = 0) {

function clampView() {
  viewZoom = Math.max(1, Math.min(256, viewZoom));
  viewOffset = Math.max(0, Math.min(Math.max(0, 1 - 1 / viewZoom), viewOffset));
}
function setZoom(newZoom, anchorNorm) {
  const oldSpan = 1 / viewZoom, anchor = anchorNorm !== undefined ? anchorNorm : (viewOffset + oldSpan * 0.5);
  const rel = (anchor - viewOffset) / oldSpan;
  viewZoom = Math.max(1, Math.min(256, newZoom));
  viewOffset = anchor - rel * (1 / viewZoom);
  clampView(); waveCacheDirty = true; requestDraw();
}

function clampSeqView() {
  seqZoom = Math.max(1, Math.min(16, seqZoom));

}

  const oldSpan = 1 / seqZoom, anchor = anchorNorm !== undefined ? anchorNorm : (seqScroll + oldSpan * 0.5);
  const rel = (anchor - seqScroll) / oldSpan;
  seqZoom = Math.max(1, Math.min(16, newZoom));
  seqScroll = anchor - rel * (1 / seqZoom);
  clampSeqView(); seqCacheDirty = true; requestDraw();
}

function renderOverviewCache(w, h) {

  const g = ovWfCtx, mid = h / 2, pad = pads[activePad];
  g.fillStyle = "#040812"; g.fillRect(0, 0, w, h);
  g.strokeStyle = "rgba(0, 240, 255, 0.16)"; g.beginPath(); g.moveTo(0, mid + 0.5); g.lineTo(w, mid + 0.5); g.stroke();
  if (!pad || !pad.rawBuf) { ovCacheDirty = false; return; }
  const data = pad.rawBuf.getChannelData(0), len = data.length, spp = len / w, stride = Math.max(1, Math.floor(spp / 28)), amp = mid - 3;
  g.fillStyle = "rgba(0, 225, 255, 0.55)";
  for (let x = 0; x < w; x++) {
    const a = Math.floor(x * spp), b = Math.min(len, Math.max(a + 1, Math.floor((x + 1) * spp)));
    let mn = 0, mx = 0;
    for (let i = a; i < b; i += stride) { const v = data[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
    g.fillRect(x, mid - mx * amp, 1, Math.max(1, (mx - mn) * amp));
  }

  g.fillStyle = "rgba(0, 0, 0, 0.62)"; g.fillRect(0, 0, stX, h); g.fillRect(enX, 0, w - enX, h);

  g.strokeStyle = pad.lockSE ? "#ffaa00" : "#ff2a85"; g.beginPath(); g.moveTo(enX, 0); g.lineTo(enX, h); g.stroke();
  ovCacheDirty = false;
}

function renderWaveCache(w, h) {
  wfCv.width = w; wfCv.height = h;
  const g = wfCtx, mid = h / 2, pad = pads[activePad];
  const bg = g.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, "#040812"); bg.addColorStop(0.5, "#071222"); bg.addColorStop(1, "#03060d");
  g.fillStyle = bg; g.fillRect(0, 0, w, h);

  g.strokeStyle = "rgba(0, 240, 255, 0.08)"; g.lineWidth = 1; g.beginPath();
  for (let x = 0; x < w; x += 48) { g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, h); }
  for (let y = 0; y < h; y += 26) { g.moveTo(0, y + 0.5); g.lineTo(w, y + 0.5); }
  g.stroke();
  g.strokeStyle = "rgba(0, 240, 255, 0.25)"; g.beginPath(); g.moveTo(0, mid + 0.5); g.lineTo(w, mid + 0.5); g.stroke();

  if (!pad || !pad.rawBuf) {
    g.fillStyle = "#00f0ff"; g.font = "bold 13px monospace"; g.textAlign = "center";
    g.fillText(`PAD ${activePad + 1} EMPTY — DRAG SAMPLE FROM TREE OR DESKTOP HERE`, w / 2, mid);
    g.textAlign = "left"; waveCacheDirty = false; return;
  }

  const rawBuf = pad.rawBuf, data = rawBuf.getChannelData(0), len = data.length;
  const viewSpan = 1 / viewZoom, viewStart = viewOffset, viewEnd = Math.min(1, viewStart + viewSpan);
  const sStart = Math.floor(viewStart * len), sEnd = Math.min(len, Math.max(sStart + 2, Math.ceil(viewEnd * len)));
  const spp = (sEnd - sStart) / w, c = getDspCoeffs(pad, rawBuf.sampleRate), srRatio = pad.sr / rawBuf.sampleRate;
  const ampScale = mid - 14;

  const shapeVis = v => {
    if (pad.bypass) return v;
    let s = (Math.tanh((v + 0.015) * pad.drv) - Math.tanh(0.015 * pad.drv)) / c.normDrive;
    s = Math.max(-1, Math.min(1, s));
    const comp = Math.sign(s) * Math.log(1 + c.mu * Math.abs(s)) / c.logMu;
    const q = Math.round(comp * c.levels) / c.levels;
    const exp = Math.sign(q) * (Math.pow(1 + c.mu, Math.abs(q)) - 1) / c.mu;
    return Math.max(-1, Math.min(1, Math.tanh(exp * c.autoMakeup * 0.95) / 0.74));
  };

  if (spp <= 2.5) {
    g.strokeStyle = pad.bypass ? "#ffaa00" : "#55ffff"; g.lineWidth = 1.6; g.beginPath();
    let lastHoldIdx = -1, holdVal = 0;
    for (let x = 0; x < w; x++) {
      const idx = Math.min(len - 1, Math.floor(sStart + x * spp));
      const v = pad.bypass ? data[idx] : (() => { const sIdx = Math.floor(idx * srRatio); if (sIdx !== lastHoldIdx) { lastHoldIdx = sIdx; holdVal = shapeVis(data[idx]); } return holdVal; })();
      const y = mid - v * ampScale; x === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    g.stroke();
  } else {
    const mins = new Float32Array(w), maxs = new Float32Array(w), rmsArr = new Float32Array(w);
    const stride = Math.max(1, Math.floor(spp / 80));
    for (let x = 0; x < w; x++) {
      const a = sStart + Math.floor(x * spp), b = Math.min(len, Math.max(a + 1, sStart + Math.floor((x + 1) * spp)));
      let mn = 0, mx = 0, sumSq = 0, cnt = 0;
      for (let i = a; i < b; i += stride) { const v = data[i]; if (v < mn) mn = v; if (v > mx) mx = v; sumSq += v * v; cnt++; }
      mins[x] = shapeVis(mn); maxs[x] = shapeVis(mx); rmsArr[x] = shapeVis(Math.sqrt(sumSq / Math.max(1, cnt)));
    }
    const wfGrad = g.createLinearGradient(0, 8, 0, h - 8);
    wfGrad.addColorStop(0, "rgba(0, 255, 210, 0.55)"); wfGrad.addColorStop(0.5, "rgba(0, 140, 255, 0.22)"); wfGrad.addColorStop(1, "rgba(0, 255, 210, 0.55)");
    g.fillStyle = wfGrad; g.beginPath(); g.moveTo(0, mid);
    for (let x = 0; x < w; x++) g.lineTo(x, mid - maxs[x] * ampScale);
    for (let x = w - 1; x >= 0; x--) g.lineTo(x, mid - mins[x] * ampScale);
    g.closePath(); g.fill();

    g.fillStyle = pad.bypass ? "rgba(255, 170, 0, 0.55)" : "rgba(0, 240, 255, 0.62)";
    g.beginPath(); g.moveTo(0, mid);
    for (let x = 0; x < w; x++) g.lineTo(x, mid - rmsArr[x] * ampScale);
    for (let x = w - 1; x >= 0; x--) g.lineTo(x, mid + rmsArr[x] * ampScale);
    g.closePath(); g.fill();
  }

  const toX = norm => ((norm - viewStart) / viewSpan) * w;
  const stX = toX(pad.st), enX = toX(pad.en);
  g.fillStyle = "rgba(0, 0, 0, 0.66)";
  if (stX > 0) g.fillRect(0, 0, Math.min(w, stX), h);
  if (enX < w) g.fillRect(Math.max(0, enX), 0, w - Math.max(0, enX), h);

  const stCol = pad.lockSE ? "#ffaa00" : "#00f0ff", enCol = pad.lockSE ? "#ffaa00" : "#ff2a85";
  if (stX >= -18 && stX <= w + 18) {
    g.strokeStyle = stCol; g.lineWidth = 2; g.beginPath(); g.moveTo(stX, 0); g.lineTo(stX, h); g.stroke();
    g.fillStyle = stCol; g.fillRect(stX, 0, pad.lockSE ? 26 : 18, 16);
    g.fillStyle = "#000"; g.font = "bold 10px monospace"; g.fillText(pad.lockSE ? "🔒S" : "S", stX + 4, 12);
  }
  if (enX >= -18 && enX <= w + 18) {
    g.strokeStyle = enCol; g.lineWidth = 2; g.beginPath(); g.moveTo(enX, 0); g.lineTo(enX, h); g.stroke();
    const tw = pad.lockSE ? 26 : 18;
    g.fillStyle = enCol; g.fillRect(enX - tw, 0, tw, 16);
    g.fillStyle = pad.lockSE ? "#000" : "#fff"; g.font = "bold 10px monospace"; g.fillText(pad.lockSE ? "🔒E" : "E", enX - tw + 4, 12);
  }

  const fxTags = [];
  if (pad.fMode > 0) fxTags.push(FMODES[pad.fMode]);
  if (pad.rmOn) fxTags.push("RING");
  if (pad.dlOn && pad.dlAmt > 0) fxTags.push("DLY");
  const hud = `PAD ${activePad + 1}: ${pad.name.slice(0, 18)} // ${pad.bypass ? "RAW" : `${G[pad.grd].name} ${pad.sr}Hz ${c.bits}B`}${fxTags.length ? " // " + fxTags.join("+") : ""}`;
  g.font = "10px monospace";
  const hw = g.measureText(hud).width + 16;
  g.fillStyle = "rgba(4, 10, 20, 0.82)"; g.fillRect(28, 6, hw, 18);
  g.strokeStyle = "rgba(0,240,255,0.35)"; g.strokeRect(28.5, 6.5, hw - 1, 17);
  g.fillStyle = pad.bypass ? "#ffaa00" : "#00ffcc"; g.fillText(hud, 36, 18);

  const winStr = `VIEW ${(viewStart * rawBuf.duration).toFixed(2)}s-${(viewEnd * rawBuf.duration).toFixed(2)}s (${viewZoom.toFixed(1)}x) | OUT ${getPadOutDur(pad).toFixed(2)}s`;
  const ww = g.measureText(winStr).width + 14;
  g.fillStyle = "rgba(4, 10, 20, 0.82)"; g.fillRect(8, h - 20, ww, 16);
  g.fillStyle = "#88e8ff"; g.fillText(winStr, 14, h - 8);
  waveCacheDirty = false;
}

const SEQ_HDR_W = 112, SEQ_VU_W = 18, SEQ_GRID_X = SEQ_HDR_W + SEQ_VU_W;
const SEQ_LOOP_H = 14, SEQ_SCRUB_H = 18, SEQ_TOP_H = SEQ_LOOP_H + SEQ_SCRUB_H;

function renderSeqCache(w, h) {
  seqCacheCv.width = w; seqCacheCv.height = h;
  const g = seqCacheCtx, gridW = w - SEQ_GRID_X;
  const visBars = seqBars / seqZoom, startBarF = seqScroll * seqBars, colW = gridW / visBars;
  const rowH = (h - SEQ_TOP_H) / Math.max(1, seqTracks.length), barDur = 240 / seqBpm;
  const barToX = b => SEQ_GRID_X + (b - startBarF) * colW;
  const snapTicks = SEQ_SNAPS[seqSnapIdx].ticks;
  const totalTicks = seqBars * TICKS_PER_BAR;

  g.fillStyle = "#040812"; g.fillRect(0, 0, w, h);
  g.fillStyle = "#0b1424"; g.fillRect(0, 0, SEQ_GRID_X, SEQ_TOP_H);
  g.fillStyle = "#00ff88"; g.font = "bold 9px monospace"; g.fillText("LOOP", 8, 10);
  g.fillStyle = "#88ccff"; g.font = "bold 10px monospace"; g.fillText("TRACK / SCRUB", 8, SEQ_LOOP_H + 13);
  g.fillStyle = "#00ff88"; g.fillText("VU", SEQ_HDR_W + 3, SEQ_LOOP_H + 13);
  g.fillStyle = "#02050a"; g.fillRect(SEQ_HDR_W, SEQ_TOP_H, SEQ_VU_W, h - SEQ_TOP_H);

  for (let t = 0; t < seqTracks.length; t++) {
    const trk = seqTracks[t], y = SEQ_TOP_H + t * rowH, col = TRK_COLS[t % TRK_COLS.length];
    g.fillStyle = t % 2 === 0 ? "#08101e" : "#060c16";
    g.fillRect(0, y, SEQ_HDR_W, rowH);
    g.strokeStyle = "rgba(0,240,255,0.12)"; g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(SEQ_HDR_W, y + 0.5); g.stroke();
    g.fillStyle = trk.mute ? "#444" : col; g.fillRect(2, y + 3, 4, rowH - 6);
    g.fillStyle = trk.mute ? "#666" : "#ddeeff"; g.font = "10px monospace";
    g.fillText(trk.mode === "step" ? `T${t + 1} [STEP]` : `T${t + 1}:P${trk.padIdx + 1} ${pads[trk.padIdx].name.slice(0, 6)}`, 10, y + rowH / 2 + 3);
  }

  g.save();
  g.beginPath(); g.rect(SEQ_GRID_X, 0, gridW, h); g.clip();
  g.fillStyle = "#07101e"; g.fillRect(SEQ_GRID_X, 0, gridW, SEQ_LOOP_H);
  g.fillStyle = "#0e1a2e"; g.fillRect(SEQ_GRID_X, SEQ_LOOP_H, gridW, SEQ_SCRUB_H);

  for (let t = 0; t < seqTracks.length; t++) {
    const y = SEQ_TOP_H + t * rowH;
    g.fillStyle = t % 2 === 0 ? "#08101e" : "#060c16"; g.fillRect(SEQ_GRID_X, y, gridW, rowH);
    g.strokeStyle = "rgba(0,240,255,0.12)"; g.beginPath(); g.moveTo(SEQ_GRID_X, y + 0.5); g.lineTo(w, y + 0.5); g.stroke();
  }

  const firstVisBar = Math.max(0, Math.floor(startBarF)), lastVisBar = Math.min(seqBars, Math.ceil(startBarF + visBars));
  const labelStep = colW < 18 ? 4 : (colW < 28 ? 2 : 1);
  const snapPx = (snapTicks / TICKS_PER_BAR) * colW;

  for (let b = firstVisBar; b <= lastVisBar; b++) {
    const x = barToX(b), isPhrase = b % 4 === 0;
    g.strokeStyle = isPhrase ? "rgba(0,240,255,0.36)" : "rgba(0,240,255,0.16)";
    g.beginPath(); g.moveTo(x + 0.5, SEQ_LOOP_H); g.lineTo(x + 0.5, h); g.stroke();
    if (b < seqBars && b % labelStep === 0) {
      g.fillStyle = isPhrase ? "#00ffcc" : "#6688aa"; g.font = "10px monospace"; g.fillText(String(b + 1), x + 3, SEQ_LOOP_H + 13);
    }
    if (b < seqBars && snapTicks < TICKS_PER_BAR && snapPx >= 6) {
      for (let tk = snapTicks; tk < TICKS_PER_BAR; tk += snapTicks) {
        const sx = x + (tk / TICKS_PER_BAR) * colW;
        const isHalfBar = tk === 4, isBeat = tk % 2 === 0;
        g.strokeStyle = isHalfBar ? "rgba(0,240,255,0.11)" : (isBeat ? "rgba(0,240,255,0.06)" : "rgba(0,240,255,0.035)");
        g.beginPath(); g.moveTo(sx + 0.5, SEQ_TOP_H); g.lineTo(sx + 0.5, h); g.stroke();
        g.strokeStyle = isBeat ? "rgba(0,240,255,0.28)" : "rgba(0,240,255,0.15)";
        g.beginPath(); g.moveTo(sx + 0.5, SEQ_LOOP_H + SEQ_SCRUB_H - (isBeat ? 5 : 3)); g.lineTo(sx + 0.5, SEQ_LOOP_H + SEQ_SCRUB_H); g.stroke();
      }
    }
  }

  const lx0 = barToX(seqLoopStart), lx1 = barToX(seqLoopEnd);
  if (seqLoopOn) {
    g.fillStyle = "rgba(0, 0, 0, 0.36)";
    if (lx0 > SEQ_GRID_X) g.fillRect(SEQ_GRID_X, SEQ_TOP_H, Math.min(gridW, lx0 - SEQ_GRID_X), h - SEQ_TOP_H);
    if (lx1 < w) g.fillRect(Math.max(SEQ_GRID_X, lx1), SEQ_TOP_H, w - Math.max(SEQ_GRID_X, lx1), h - SEQ_TOP_H);
    g.fillStyle = "rgba(0, 255, 136, 0.35)"; g.fillRect(lx0, 1, Math.max(4, lx1 - lx0), SEQ_LOOP_H - 2);
    g.strokeStyle = "#00ff88"; g.lineWidth = 1.2; g.strokeRect(lx0 + 0.5, 1.5, Math.max(3, lx1 - lx0 - 1), SEQ_LOOP_H - 3);
    g.fillStyle = "#00ff88"; g.fillRect(lx0, 1, 7, SEQ_LOOP_H - 2); g.fillRect(lx1 - 7, 1, 7, SEQ_LOOP_H - 2);
    g.fillStyle = "#002211"; g.font = "bold 9px monospace";
    const fBar = v => Number.isInteger(v) ? String(v) : v.toFixed(2);
    if (lx1 - lx0 > 46) g.fillText(`LOOP ${fBar(seqLoopStart + 1)}-${fBar(seqLoopEnd)}`, lx0 + 10, 10);
  } else {
    g.fillStyle = "rgba(120, 150, 180, 0.16)"; g.fillRect(lx0, 2, Math.max(4, lx1 - lx0), SEQ_LOOP_H - 4);
  }

  for (let t = 0; t < seqTracks.length; t++) {
    const trk = seqTracks[t], y = SEQ_TOP_H + t * rowH, col = TRK_COLS[t % TRK_COLS.length];
    if (trk.mode === "loop") {
      const pad = pads[trk.padIdx], padDur = getPadOutDur(pad), naturalBars = padDur > 0 ? padDur / barDur : 1;
      for (let k = 0; k < totalTicks; k++) {
        if (!trk.cells[k]) continue;
        let maxTicks = totalTicks - k;
        for (let nk = k + 1; nk < totalTicks; nk++) if (trk.cells[nk]) { maxTicks = nk - k; break; }
        const startB = k / TICKS_PER_BAR;
        const drawnBars = Math.min(naturalBars, maxTicks / TICKS_PER_BAR);
        if (startB + drawnBars < startBarF || startB > startBarF + visBars) continue;
        const clipX = barToX(startB), fullPx = Math.max(6, naturalBars * colW), clipW = Math.max(5, drawnBars * colW - 1.5);
        const clipY = y + 3, clipH = rowH - 6;
        const inSel = seqSel && t >= seqSel.t0 && t <= seqSel.t1 && k >= seqSel.k0 && k < seqSel.k1;

        g.fillStyle = trk.mute ? "rgba(70,70,70,0.35)" : (inSel ? "rgba(0, 95, 135, 0.92)" : "rgba(0, 40, 68, 0.85)");
        g.fillRect(clipX + 1, clipY, clipW, clipH);
        g.strokeStyle = inSel ? "#ffffff" : (trk.mute ? "#555" : col);
        g.lineWidth = inSel ? 1.8 : 1;
        g.strokeRect(clipX + 1.5, clipY + 0.5, clipW - 1, clipH - 1);

        if (pad.miniPeaks) {
          const peaks = pad.miniPeaks, midY = clipY + clipH / 2, ampH = (clipH / 2) - 2;
          g.fillStyle = trk.mute ? "rgba(140,140,140,0.5)" : (inSel ? "#ffffff" : col);
          const pxStart = Math.max(0, Math.floor(SEQ_GRID_X - (clipX + 2))), pxEnd = Math.min(Math.floor(clipW - 2), Math.ceil(w - (clipX + 2)));
          for (let px = pxStart; px < pxEnd; px++) {
            const norm = px / fullPx; if (norm >= 1) break;
            const ph = Math.max(1, peaks[Math.min(peaks.length - 1, Math.floor(norm * peaks.length))] * ampH);
            g.fillRect(clipX + 2 + px, midY - ph, 1, ph * 2);
          }
        }
        if (clipW > 22) {
          g.fillStyle = "rgba(0,0,0,0.68)"; g.fillRect(clipX + 2, clipY + 1, Math.min(clipW - 3, 52), 11);
          g.fillStyle = "#fff"; g.font = "9px monospace"; g.fillText(`P${trk.padIdx + 1} ${naturalBars.toFixed(1)}b`, clipX + 4, clipY + 9);
        }
      }
    } else {
      for (let k = 0; k < totalTicks; k++) {
        const pNum = trk.cells[k]; if (!pNum) continue;
        let spanTicks = Math.min(TICKS_PER_BAR, totalTicks - k);
        for (let nk = k + 1; nk < k + spanTicks; nk++) if (trk.cells[nk]) { spanTicks = nk - k; break; }
        const startB = k / TICKS_PER_BAR, drawnBars = spanTicks / TICKS_PER_BAR;
        if (startB + drawnBars < startBarF || startB > startBarF + visBars) continue;

        const pCol = PAT_COLS[(pNum - 1) % PAT_COLS.length];
        const x = barToX(startB), cy = y + 3, ch = rowH - 6, cw = Math.max(4, drawnBars * colW - 1.5);
        const fullBarW = Math.max(4, colW - 2);
        const inSel = seqSel && t >= seqSel.t0 && t <= seqSel.t1 && k >= seqSel.k0 && k < seqSel.k1;

        g.fillStyle = trk.mute ? "rgba(70,70,70,0.4)" : (inSel ? "rgba(42, 65, 98, 0.95)" : "rgba(18, 28, 48, 0.92)");
        g.fillRect(x + 1, cy, cw, ch);
        g.strokeStyle = inSel ? "#ffffff" : (trk.mute ? "#555" : pCol);
        g.lineWidth = inSel ? 1.8 : 1.2;
        g.strokeRect(x + 1.5, cy + 0.5, cw - 1, ch - 1);

        if (cw >= 10) {
          const pat = stepPats[pNum - 1], sw = (fullBarW - 4) / 16, sh = (ch - 10) / 8;
          const activeSteps = spanTicks * STEPS_PER_TICK;
          g.fillStyle = trk.mute ? "#888" : (inSel ? "#ffffff" : pCol);
          for (let ln = 0; ln < 8; ln++) {
            for (let st = 0; st < activeSteps; st++) {
              if (pat[ln][st]) g.fillRect(x + 3 + st * sw, cy + 9 + ln * sh, Math.max(1, sw - 0.4), Math.max(1, sh - 0.3));
            }
          }
          g.fillStyle = trk.mute ? "#999" : pCol; g.font = "bold 9px monospace"; g.fillText(`P${pNum}`, x + 3, cy + 8);
        }
      }
    }
  }
  g.restore();
  seqCacheDirty = false;
}
